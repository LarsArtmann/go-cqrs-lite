syntax = "proto3";

package cqrs.v1;

option go_package = "github.com/larsartmann/go-cqrs-lite/transport/grpc/v4/proto;cqrsproto";

// CommandEnvelope wraps a CQRS command for wire transmission.
// The payload is JSON-encoded (matching the watermill protocol).
message CommandEnvelope {
  string type = 1; // command type (e.g. "user.create")
  string aggregate_id = 2; // aggregate ID (ULID)
  string aggregate_type = 3; // aggregate type (e.g. "User")
  bytes payload = 4; // JSON-encoded command payload
  map<string, string> metadata = 5; // command metadata
}

// CommandResult is the response from a command dispatch.
message CommandResult {
  bool success = 1;
  string error = 2; // human-readable error message
  string error_code = 3; // machine-readable code (e.g. "event.version_conflict"); empty on success
  string error_family = 4; // taxonomy family: "rejection", "conflict", "transient", "corruption", "infrastructure"; empty on success
}

// QueryEnvelope wraps a CQRS query for wire transmission.
message QueryEnvelope {
  string type = 1; // query type (e.g. "user.get")
  bytes payload = 2; // JSON-encoded query payload
  map<string, string> metadata = 3; // query metadata
}

// QueryResult is the response from a query dispatch.
message QueryResult {
  bytes payload = 1; // JSON-encoded result
  string error = 2; // human-readable error message
  string error_code = 3; // machine-readable code; empty on success
  string error_family = 4; // taxonomy family; empty on success
}

// CommandService dispatches commands to the local handler.
service CommandService {
  rpc Dispatch(CommandEnvelope) returns (CommandResult);
}

// QueryService dispatches queries to the local handler.
service QueryService {
  rpc Ask(QueryEnvelope) returns (QueryResult);
}

// EventEnvelope wraps a CQRS event for streaming over gRPC.
message EventEnvelope {
  string id = 1; // event ID (ULID)
  string type = 2; // event type (e.g. "user.created")
  string aggregate_id = 3; // aggregate ID (ULID)
  string aggregate_type = 4; // aggregate type (e.g. "User")
  int64 version = 5; // aggregate version after this event
  bytes payload = 6; // raw event payload bytes
  int64 occurred_at_unix_nano = 7; // event timestamp (Unix nanoseconds)
  map<string, string> metadata = 8; // event metadata
}

// SubscriptionRequest filters the event stream. Empty event_types = all events.
message SubscriptionRequest {
  repeated string event_types = 1; // filter by event type (empty = subscribe to all)
}

// EventService streams events to subscribers. Server-streaming RPC.
service EventService {
  rpc Subscribe(SubscriptionRequest) returns (stream EventEnvelope);
}
