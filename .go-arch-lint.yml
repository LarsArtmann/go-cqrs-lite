# go-arch-lint configuration for go-cqrs-lite (workspace-level)
#
# ARCHITECTURE ENFORCEMENT — TWO LAYERS
#
# Layer 1: Cross-module rules → scripts/check-module-layers.sh (CI-enforced)
#   Parses go.mod files directly to enforce the 0-7 layer model below.
#   This is the authoritative gate because go-arch-lint cannot resolve
#   versioned cross-module imports (/v3 suffix) in Go workspaces.
#
# Layer 2: Intra-module package rules → scripts/check-arch.sh
#   Runs go-arch-lint PER MODULE (from within each module directory)
#   where the module boundary is respected. Only modules with a local
#   .go-arch-lint.yml are checked. This catches package-level violations
#   that cross-module checking cannot see (e.g., storage/sql imported by
#   storage/memory, which lives in a different module).
#
# This file documents the workspace architecture for humans and tools.
# The component and deps sections below mirror check-module-layers.sh.
#
# Layer model (higher layers may depend on lower layers only):
#   Layer 0: id, dispatcher, codec, kv            (leaf modules, no internal deps)
#   Layer 1: event, command, query                 (domain types + interfaces)
#   Layer 2: schema, snapshot, graph               (domain services)
#   Layer 3: decider                               (aggregate orchestration)
#   Layer 4: storage/memory, signing, encryption, otel  (infra primitives)
#   Layer 5: middleware, storage, listing, watermill,
#            transport/http, transport/grpc,
#            storage/pebble, storage/turso, prometheus
#   Layer 6: stack presets                         (composition layer)
#   Layer 7: catalog, integration, examples, cmd   (top-level integration)

version: 3

allow:
  depOnAnyVendor: true

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*eventtest/.*$"
  - "^.*querytest/.*$"
  - "^.*idtest/.*$"
  - "^.*viewstoretest/.*$"
  - "^.*testdata/.*$"
  - "^.*example/.*$"

components:
  id: { in: id/** }
  dispatcher: { in: dispatcher/** }
  codec: { in: codec/** }
  kv: { in: kv/** }
  event: { in: event/** }
  command: { in: command/** }
  query: { in: query/** }
  schema: { in: schema/** }
  snapshot: { in: snapshot/** }
  graph: { in: graph/** }
  decider: { in: decider/** }
  signing: { in: signing/** }
  encryption: { in: encryption/** }
  otel: { in: otel/** }
  storage: { in: storage/** }
  middleware: { in: middleware/** }
  listing: { in: listing/** }
  watermill: { in: watermill/** }
  transporthttp: { in: transport/http/** }
  transportgrpc: { in: transport/grpc/** }
  prometheus: { in: prometheus/** }
  stack: { in: stack/** }
  catalog: { in: catalog/** }
  integration: { in: integration/** }
  cmd: { in: cmd/** }

# The deps section mirrors the layer model in scripts/check-module-layers.sh.
# NOTE: go-arch-lint CANNOT enforce these cross-module rules in a Go workspace
# with versioned module paths (/v3 suffix). This section documents the intended
# architecture for reference. Actual enforcement is via check-module-layers.sh.
# Intra-module package rules are enforced by per-module .go-arch-lint.yml files.
deps:
  id: { anyProjectDeps: false, anyVendorDeps: true }
  dispatcher: { anyProjectDeps: false, anyVendorDeps: true }
  codec: { anyProjectDeps: false, anyVendorDeps: true }
  kv: { anyProjectDeps: false, anyVendorDeps: true }
  event: { anyProjectDeps: false, anyVendorDeps: true }
  command: { anyProjectDeps: false, anyVendorDeps: true }
  query: { anyProjectDeps: false, anyVendorDeps: true }
  schema: { anyProjectDeps: false, anyVendorDeps: true }
  snapshot: { anyProjectDeps: false, anyVendorDeps: true }
  graph: { anyProjectDeps: false, anyVendorDeps: true }
  decider: { anyProjectDeps: false, anyVendorDeps: true }
  signing: { anyProjectDeps: false, anyVendorDeps: true }
  encryption: { anyProjectDeps: false, anyVendorDeps: true }
  otel: { anyProjectDeps: false, anyVendorDeps: true }
  storagemem: { anyProjectDeps: false, anyVendorDeps: true }
  middleware: { anyProjectDeps: false, anyVendorDeps: true }
  storage: { anyProjectDeps: false, anyVendorDeps: true }
  listing: { anyProjectDeps: false, anyVendorDeps: true }
  watermill: { anyProjectDeps: false, anyVendorDeps: true }
  transporthttp: { anyProjectDeps: false, anyVendorDeps: true }
  transportgrpc: { anyProjectDeps: false, anyVendorDeps: true }
  prometheus: { anyProjectDeps: false, anyVendorDeps: true }
  stack: { anyProjectDeps: false, anyVendorDeps: true }
  catalog: { anyProjectDeps: true, anyVendorDeps: true }
  integration: { anyProjectDeps: true, anyVendorDeps: true }
  cmd: { anyProjectDeps: true, anyVendorDeps: true }
