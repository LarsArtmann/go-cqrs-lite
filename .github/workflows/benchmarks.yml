name: Benchmarks

on:
  # Run on pushes to master that touch benchkit or benchmark code
  push:
    branches: [master]
    paths:
      - "benchkit/**"
      - "stack/bench/**"
      - "metaengine/**"
      - "cmd/cqrs-bench/**"
      - "scripts/bench-matrix.sh"
      - ".github/workflows/benchmarks.yml"
  # Nightly schedule for full benchmarks
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  # Manual trigger
  workflow_dispatch:

jobs:
  # Quick benchmark: memory backend, dev profile, 3 samples
  # Runs on every push that touches benchmark code
  quick:
    name: Quick Benchmark (Memory)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc
        with:
          name: larsartmann
          skipPush: true

      - name: Build benchkit
        run: nix run .#build

      - name: Run memory benchmark
        run: |
          GOEXPERIMENT=jsonv2 go run -tags "goexperiment.jsonv2" \
            ./cmd/cqrs-bench run \
            --backend memory \
            --profile dev \
            --repeat 3 \
            --format benchstat

      - name: Run raw sink comparison
        run: |
          GOEXPERIMENT=jsonv2 go run -tags "goexperiment.jsonv2" \
            ./cmd/cqrs-bench run \
            --backend memory \
            --profile dev \
            --repeat 3 \
            --format text

  # Go benchmarks: run standard testing.B benchmarks
  go-bench:
    name: Go Benchmarks (stack/bench)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run Go benchmarks
        run: |
          cd stack/bench && \
          GOEXPERIMENT=jsonv2 go test -tags "goexperiment.jsonv2" \
            -bench=. -benchmem -benchtime=100x -count=1 \
            -timeout 5m

  # Nightly: full benchmark suite across all in-process backends
  nightly:
    name: Nightly Full Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc
        with:
          name: larsartmann
          skipPush: true

      - name: Build
        run: nix run .#build

      - name: Memory benchmark (small profile, 5 repeats)
        run: |
          GOEXPERIMENT=jsonv2 go run -tags "goexperiment.jsonv2" \
            ./cmd/cqrs-bench run \
            --backend memory \
            --profile small \
            --repeat 5 \
            --format json \
            --output benchmarks/memory-small.json

      - name: SQLite benchmark (small profile, 5 repeats)
        run: |
          GOEXPERIMENT=jsonv2 go run -tags "goexperiment.jsonv2" \
            ./cmd/cqrs-bench run \
            --backend sqlite \
            --profile small \
            --repeat 5 \
            --format json \
            --output benchmarks/sqlite-small.json

      - name: Pebble benchmark (small profile, 5 repeats)
        run: |
          GOEXPERIMENT=jsonv2 go run -tags "goexperiment.jsonv2" \
            ./cmd/cqrs-bench run \
            --backend pebble \
            --profile small \
            --repeat 5 \
            --format json \
            --output benchmarks/pebble-small.json

      - name: Multi-backend comparison
        run: |
          GOEXPERIMENT=jsonv2 go run -tags "goexperiment.jsonv2" \
            ./cmd/cqrs-bench compare \
            --profile small \
            --format markdown \
            --output benchmarks/comparison.md

      - name: Scaling sweep (workers)
        run: |
          GOEXPERIMENT=jsonv2 go run -tags "goexperiment.jsonv2" \
            ./cmd/cqrs-bench sweep \
            --param workers \
            --values 1,2,4,8,16 \
            --backend memory \
            --profile small \
            --format json \
            --output benchmarks/worker-sweep.json

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-results
          path: benchmarks/
          retention-days: 90

  # Matrix benchmark: runs the comprehensive matrix runner
  matrix:
    name: Benchmark Matrix
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build
        run: nix run .#build

      - name: Run benchmark matrix
        run: |
          bash scripts/bench-matrix.sh \
            --benchtime 3x \
            --count 3 \
            --output benchmarks/matrix-results.txt

      - name: Upload matrix results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-matrix
          path: benchmarks/
          retention-days: 90

  # Regression gate: median-based threshold compare against the previous
  # run's baseline artifact (same runner class). FAILS the build on breach.
  regression:
    name: Benchmark Regression Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download baseline
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: benchmark-baseline
          path: baseline/

      - name: Run gate benchmarks
        run: |
          cd stack/bench && \
          GOEXPERIMENT=jsonv2 go test -tags "goexperiment.jsonv2" \
            -bench='BenchmarkFullPipeline_Memory|BenchmarkBenchkitSuite_Memory$' \
            -run='^$' -benchmem -benchtime=10x -count=5 \
            -timeout 10m 2>&1 | tee ../current.txt

      - name: Compare with baseline (fails on >25% median regression)
        run: |
          ./scripts/benchmark-regression.sh \
            --baseline baseline/baseline.txt \
            --current current.txt \
            --threshold 25

      - name: Refresh baseline for next run
        if: ${{ !cancelled() }} # D3: refresh even on breach — a failed gate must not freeze the baseline artifact
        run: |
          mkdir -p baseline
          cp current.txt baseline/baseline.txt

      - name: Upload baseline
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-baseline
          path: baseline/

  # Calibration drift: fresh per-pattern benches vs shipped ReadCosts
  # constants (docs/benchmarks/calibration-2026-08-30.md). Warns >25%,
  # fails >=100% (2x). Nightly + manual; dedicated runner assumed.
  calibration-drift:
    name: Calibration Drift (ReadCosts)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run calibration drift check
        run: |
          bash scripts/calibration-drift.sh

      - name: Upload drift log on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: calibration-drift
          path: |
            /tmp/calibration-drift-*.log
          if-no-files-found: ignore
          retention-days: 30
