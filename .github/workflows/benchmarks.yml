name: Benchmarks

on:
  # Run on pushes to master that touch benchkit or benchmark code
  push:
    branches: [master]
    paths:
      - "benchkit/**"
      - "stack/bench/**"
      - "metaengine/**"
      - "cmd/cqrs-bench/**"
      - "scripts/bench-matrix.sh"
      - ".github/workflows/benchmarks.yml"
  # Nightly schedule for full benchmarks
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  # Manual trigger
  workflow_dispatch:

# Per-event-class groups: a push must never cancel a cold or dispatched
# calibration/baseline run (that is how dispatch 42500450496 was lost on
# 2026-11-08), and the nightly matrix must not be cancelled by either.
# Within the push and dispatch classes the newest run supersedes; scheduled
# runs are never cancelled (baseline continuity).
concurrency:
  group: benchmarks-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # Quick benchmark: memory backend, dev profile, 3 samples
  # Runs on every push that touches benchmark code
  quick:
    name: Quick Benchmark (Memory)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # cachix-action removed 2026-09-03: with skipPush it only pulls and
      # the larsartmann cache requires auth, so the step always failed.

      - name: Build benchkit
        run: nix run .#build

      - name: Run memory benchmark
        run: |
          go run \
            ./cmd/cqrs-bench run \
            --backend memory \
            --profile dev \
            --repeat 3 \
            --format benchstat

      - name: Run raw sink comparison
        run: |
          go run \
            ./cmd/cqrs-bench run \
            --backend memory \
            --profile dev \
            --repeat 3 \
            --format text

  # Go benchmarks: run standard testing.B benchmarks
  go-bench:
    name: Go Benchmarks (stack/bench)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run Go benchmarks
        run: |
          cd stack/bench && \
          go test \
            -bench=. -benchmem -benchtime=100x -count=1 \
            -timeout 5m

  # Nightly: full benchmark suite across all in-process backends
  nightly:
    name: Nightly Full Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # cachix-action removed 2026-09-03: with skipPush it only pulls and
      # the larsartmann cache requires auth, so the step always failed.

      - name: Build
        run: nix run .#build

      - name: Memory benchmark (small profile, 5 repeats)
        run: |
          go run \
            ./cmd/cqrs-bench run \
            --backend memory \
            --profile small \
            --repeat 5 \
            --format json \
            --output benchmarks/memory-small.json

      - name: SQLite benchmark (small profile, 5 repeats)
        run: |
          go run \
            ./cmd/cqrs-bench run \
            --backend sqlite \
            --profile small \
            --repeat 5 \
            --format json \
            --output benchmarks/sqlite-small.json

      - name: Pebble benchmark (small profile, 5 repeats)
        run: |
          go run \
            ./cmd/cqrs-bench run \
            --backend pebble \
            --profile small \
            --repeat 5 \
            --format json \
            --output benchmarks/pebble-small.json

      - name: Multi-backend comparison
        run: |
          go run \
            ./cmd/cqrs-bench compare \
            --profile small \
            --format markdown \
            --output benchmarks/comparison.md

      - name: Scaling sweep (workers)
        run: |
          go run \
            ./cmd/cqrs-bench sweep \
            --param workers \
            --values 1,2,4,8,16 \
            --backend memory \
            --profile small \
            --format json \
            --output benchmarks/worker-sweep.json

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: benchmarks/
          retention-days: 90

  # Matrix benchmark: runs the comprehensive matrix runner
  matrix:
    name: Benchmark Matrix
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build
        run: nix run .#build

      - name: Run benchmark matrix
        run: |
          bash scripts/bench-matrix.sh \
            --benchtime 3x \
            --count 3 \
            --output benchmarks/matrix-results.txt

      - name: Upload matrix results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-matrix
          path: benchmarks/
          retention-days: 90

  # Regression gate: median-based threshold compare against the previous
  # run's baseline artifact (same runner class). FAILS the build on breach.
  regression:
    name: Benchmark Regression Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download baseline
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-baseline
          path: baseline/

      - name: Noise gate (benchkit per-metric CoV on headline metrics)
        run: ./scripts/benchmark-regression.sh --noise-only

      - name: Run gate benchmarks
        run: |
          # pipefail: a compile error or panic inside any suite must fail the
          # step, not tee an empty/partial current.txt into a green compare.
          set -o pipefail
          # Subshells keep each suite rooted in its own module while
          # current.txt lands at the repo root where the compare step reads
          # it. The previous single-cd form hopped ../metaengine/tursoengine
          # from stack/bench (nonexistent path) and teed to stack/current.txt.
          (cd stack/bench && \
          go test \
            -bench='BenchmarkFullPipeline_Memory|BenchmarkBenchkitSuite_Memory$' \
            -run='^$' -benchmem -benchtime=10x -count=5 \
            -timeout 10m) 2>&1 | tee current.txt
          # SQLite backend path (2026-09-16 decision: the second gate-set
          # entry rides along with the per-metric noise gate).
          (cd stack/bench && \
          go test \
            -bench='BenchmarkBenchkitSuite_SQLite$' \
            -run='^$' -benchmem -benchtime=10x -count=5 \
            -timeout 10m) 2>&1 | tee -a current.txt
          (cd metaengine/tursoengine && \
          go test \
            -bench='BenchmarkMatViewRead/agg=[A-Z]+/scale=1k' \
            -run='^$' -benchmem -benchtime=100x -count=9 \
            -timeout 10m) 2>&1 | tee -a current.txt

      - name: Compare with baseline (fails on >25% median regression)
        run: |
          ./scripts/benchmark-regression.sh \
            --baseline baseline/baseline.txt \
            --current current.txt \
            --threshold 25

      - name: Refresh baseline for next run
        if: ${{ !cancelled() }} # D3: refresh even on breach — a failed gate must not freeze the baseline artifact
        run: |
          mkdir -p baseline
          # A noise-gate failure kills the job BEFORE the gate-benchmark step
          # produces current.txt — refreshing then would cp a nonexistent
          # file and mask the real failure. Nothing to refresh in that case.
          if [ -f current.txt ]; then
            cp current.txt baseline/baseline.txt
          else
            echo "no current.txt (job failed before gate benchmarks ran) — baseline not refreshed"
          fi

      - name: Upload baseline
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-baseline
          path: baseline/

  # Calibration drift: fresh per-pattern benches vs the previous run's
  # runner-class baseline (actions/cache, same `calib-` namespace as
  # nightly-gates.yml). Warns >25%, fails >=100% (2x). Comparing against the
  # shipped ReadCosts constants on a shared GitHub runner failed nightly for
  # the wrong reason: every engine drifted together with the host, not the
  # code. Nightly + manual.
  calibration-drift:
    name: Calibration Drift (ReadCosts)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # cachix-action removed 2026-09-03: with skipPush it only pulls and
      # the larsartmann cache requires auth, so the step always failed.

      - name: Calibration date
        id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Rolling runner-class baseline (same calib- cache namespace as
      # nightly-gates.yml): today's key, restore-keys falls back to the most
      # recent calibration. Without this, --baseline has nothing to compare.
      - name: Restore previous calibration baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/calibration-baseline.txt
          key: calib-${{ steps.date.outputs.date }}
          restore-keys: |
            calib-

      - name: Run calibration drift check
        run: |
          set -o pipefail
          mkdir -p build
          if [ ! -f build/calibration-baseline.txt ]; then
            echo "no runner-class baseline yet — this run establishes one; comparison starts next run" | tee build/calibration-drift.log
          else
            bash scripts/calibration-drift.sh --baseline build/calibration-baseline.txt 2>&1 | tee build/calibration-drift.log
          fi

      # Only a green comparison refreshes the baseline: a failed drift gate must
      # freeze the prior baseline until the regression is fixed, or night N+1
      # compares against the regression itself and goes green.
      - name: Refresh calibration baseline for the next run
        if: success()
        run: nix run .#calibration-drift -- --write-baseline build/calibration-baseline.txt

      - name: Upload drift log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calibration-drift
          path: build/calibration-drift.log
          if-no-files-found: warn
          retention-days: 30
