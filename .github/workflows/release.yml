name: Release

on:
  push:
    tags:
      - "v*"
      - "*/v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.27"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Verify ONLY the tagged module. The old all-modules loop could never
      # pass on public runners: cmd/cqrs-lint requires the PRIVATE
      # github.com/larsartmann/go-finding, which has no CI credentials
      # (every tag run since 2026-08-29 died at `git ls-remote` exit 128).
      # The full matrix is ci.yml's job on master pushes; a tag run only
      # needs to prove the tag itself builds, tests, and is vuln-clean.
      # Tag shape is always <module-path>/vX.Y.Z, so stripping the last
      # /v-segment yields the module directory.
      - name: Resolve tagged module
        run: |
          MOD="${GITHUB_REF_NAME%/*}"
          echo "MOD=$MOD" >> "$GITHUB_ENV"
          echo "Tagged module: $MOD"

      - name: Build tagged module
        if: env.MOD != 'cmd/cqrs-lint'
        run: (cd "$MOD" && GOWORK=off go build ./...)

      - name: Test tagged module
        if: env.MOD != 'cmd/cqrs-lint'
        run: (cd "$MOD" && GOWORK=off go test -race ./...)

      - name: Run govulncheck on tagged module
        if: env.MOD != 'cmd/cqrs-lint'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd "$MOD" && GOWORK=off govulncheck ./...)

      # cmd/cqrs-lint depends on the private go-finding repo; its builds are
      # verified locally (tag-release.sh standalone gate) and by CI legs that
      # have credentials. Skipping here is deliberate, not an oversight.

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
