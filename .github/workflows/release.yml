name: Release

on:
  push:
    tags:
      - "v*"
      - "*/v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  GOEXPERIMENT: jsonv2

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build all modules
        run: |
          # Auto-discover all modules from go.work (excluding test-only submodules)
          MODULES=$(grep -oE '\./[a-zA-Z0-9/_-]+' go.work \
            | sed 's|^\./||' \
            | grep -v '^event/v4/eventtest$' \
            | grep -v '^id/idtest$' \
            | grep -v '^query/querytest$' \
            | grep -v '^\.$' \
            | sort)
          for mod in $MODULES; do
            echo "::group::Build $mod"
            (cd "$mod" && GOWORK=off go build ./...)
            echo "::endgroup::"
          done

      - name: Test all modules
        run: |
          MODULES=$(grep -oE '\./[a-zA-Z0-9/_-]+' go.work \
            | sed 's|^\./||' \
            | grep -v '^event/v4/eventtest$' \
            | grep -v '^id/idtest$' \
            | grep -v '^query/querytest$' \
            | grep -v '^\.$' \
            | sort)
          for mod in $MODULES; do
            echo "::group::Test $mod"
            (cd "$mod" && GOWORK=off go test -race ./...)
            echo "::endgroup::"
          done

      - name: Run govulncheck on all modules
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          MODULES=$(grep -oE '\./[a-zA-Z0-9/_-]+' go.work \
            | sed 's|^\./||' \
            | grep -v '^event/v4/eventtest$' \
            | grep -v '^id/idtest$' \
            | grep -v '^query/querytest$' \
            | grep -v '^\.$' \
            | sort)
          for mod in $MODULES; do
            echo "::group::govulncheck $mod"
            (cd "$mod" && GOWORK=off govulncheck ./... 2>/dev/null || echo "WARN: govulncheck skipped for $mod")
            echo "::endgroup::"
          done

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
