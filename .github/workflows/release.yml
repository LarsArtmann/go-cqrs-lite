name: Release

on:
  push:
    tags:
      - "v*"
      - "*/v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.27"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Verify ONLY the tagged module. The old all-modules loop could never
      # pass on public runners: cmd/cqrs-lint/v4 requires the PRIVATE
      # github.com/larsartmann/go-finding, which has no CI credentials
      # (every tag run since 2026-08-29 died at `git ls-remote` exit 128).
      # The full matrix is ci.yml's job on master pushes; a tag run only
      # needs to prove the tag itself builds, tests, and is vuln-clean.
      # Tag shape is <module-path>/vX.Y.Z where module-path itself ends in
      # /vN (catalog/v4.15.0 tags module catalog/v4), so strip ONLY the
      # version suffix — "%/*" stripped the /v4 too and cd'ed into the
      # module's parent dir (catalog/, no go.mod; the catalog/v4.15.0 tag
      # run 43446210196 died in 34s on exactly that, 2026-11-13).
      - name: Resolve tagged module
        run: |
          # Go module tag semantics: <module-path>/vX.Y.Z where module-path
          # itself ends in /vN (catalog/v4.15.0 tags module catalog/v4).
          # Derive the module dir as dirname + "/v" + major-version.
          SEG="${GITHUB_REF_NAME##*/}"   # vX.Y.Z
          MAJOR="${SEG#v}"; MAJOR="${MAJOR%%.*}"
          if [[ "$GITHUB_REF_NAME" == */* ]]; then
            DIR="${GITHUB_REF_NAME%/*}"
            # core/v5/v5.0.1 tags core/v5 (dir already ends in the major);
            # catalog/v4.15.0 tags catalog/v4 (dir needs /v$MAJOR appended).
            if [[ "$DIR" == "v$MAJOR" || "$DIR" == */v$MAJOR ]]; then
              MOD="$DIR"
            else
              MOD="$DIR/v$MAJOR"
            fi
          else
            MOD="."   # root-module tag (v4.0.1, no slash)
          fi
          echo "MOD=$MOD" >> "$GITHUB_ENV"
          echo "Tagged module: $MOD"

      - name: Build tagged module
        if: env.MOD != 'cmd/cqrs-lint/v4'
        run: (cd "$MOD" && GOWORK=off go build ./...)

      - name: Test tagged module
        if: env.MOD != 'cmd/cqrs-lint/v4'
        run: (cd "$MOD" && GOWORK=off go test -race ./...)

      - name: Run govulncheck on tagged module
        if: env.MOD != 'cmd/cqrs-lint/v4'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd "$MOD" && GOWORK=off govulncheck ./...)

      # cmd/cqrs-lint/v4 depends on the private go-finding repo; its builds are
      # verified locally (tag-release.sh standalone gate) and by CI legs that
      # have credentials. Skipping here is deliberate, not an oversight.

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
