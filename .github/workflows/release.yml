name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: v2.12

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: |
          for mod in core memory catalog middleware integration projection storage; do
            echo "::group::Build $mod"
            (cd "$mod" && GOWORK=off go build ./...)
            echo "::endgroup::"
          done

      - name: Test
        run: |
          for mod in core memory catalog middleware integration projection storage; do
            echo "::group::Test $mod"
            (cd "$mod" && GOWORK=off go test -v -race ./...)
            echo "::endgroup::"
          done

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for mod in core memory catalog middleware integration projection storage; do
            echo "::group::govulncheck $mod"
            (cd "$mod" && GOWORK=off govulncheck ./...)
            echo "::endgroup::"
          done

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
