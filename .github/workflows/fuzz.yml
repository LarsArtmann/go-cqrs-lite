name: Fuzz Nightly

on:
  # Nightly short-burst fuzzing of the SQL-injection gates. The seed corpus
  # under storage/sql/testdata/fuzz runs on every CI push via `go test`;
  # this workflow adds live mutation beyond the seeds.
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC daily, after the benchmark nightly
  # Manual trigger
  workflow_dispatch:

jobs:
  fuzz:
    name: Fuzz storage/sql injection gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # NOTE: cachix-action removed 2026-09-03 — with skipPush it only pulls
      # and the larsartmann cache requires auth, so the step always failed.

      - name: Fuzz identifier + WHERE validation (60s per target)
        working-directory: storage
        run: |
          export GOWORK=off
          export GOCACHE=/tmp/gocache-fuzz GOMODCACHE=/tmp/gomod-fuzz
          for target in \
            FuzzValidateIdentifier_RejectsAllNonIdentifiers \
            FuzzValidateIdentifier_MetacharacterCombinations \
            FuzzBuildWhereClauseChecked_NeverPanics \
            FuzzBuildWhereClauseChecked_MultiCondition; do
            echo "::group::$target"
            GOTOOLCHAIN=auto go test -tags "goexperiment.jsonv2" \
              -run "^${target}$" -fuzz "^${target}$" -fuzztime 60s ./sql/
            echo "::endgroup::"
          done

      - name: Upload failure corpus on crash
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-failure-corpus
          path: storage/sql/testdata/fuzz/
          if-no-files-found: ignore
