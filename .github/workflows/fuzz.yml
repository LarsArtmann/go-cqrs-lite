name: Fuzz Nightly

on:
  # Nightly fuzzing across the WHOLE inventory, not a hand-picked four.
  # scripts/fuzz-targets.txt lists all 115 targets (2026-10-26 census) and
  # scripts/fuzz-rotation.sh rotates a shard per night, so every target runs
  # at least once every 4 nights while each job stays bounded.
  #
  # The seed corpora under */testdata/fuzz/ still run on every push via
  # `go test`; this workflow adds live mutation beyond the seeds.
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC daily, after the benchmark nightly
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per fuzz target"
        required: false
        default: "60"

permissions:
  contents: read

# The nightly shard rotation is never cancelled (corpus continuity); a
# manual re-dispatch supersedes an earlier in-flight dispatch only.
concurrency:
  group: fuzz-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  # Fail loudly if the inventory and the tree disagree: a new Fuzz function
  # that nobody regenerates the inventory for would otherwise never fuzz.
  inventory:
    name: Fuzz inventory drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Inventory matches the tree
        run: |
          # The rotation self-test runs before the inventory check: its
          # fixture mutations are the canary for the sharding logic itself
          # (audit finding 2026-11-09 — it was shipped but never wired).
          bash scripts/fuzz-rotation.sh --self-test
          bash scripts/fuzz-rotation.sh --update-targets
          if ! git diff --exit-code -- scripts/fuzz-targets.txt; then
            echo "::error::scripts/fuzz-targets.txt is stale - commit the regenerated inventory (a new Fuzz target must be fuzzed, not silently skipped)."
            exit 1
          fi

  fuzz:
    name: Fuzz shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    needs: inventory
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # go writes new interesting inputs into <pkg>/testdata/fuzz/<Target>/.
      # Caching them means a crash found on night N is a regression case on
      # night N+1 without anyone copying files by hand.
      - name: Restore fuzz corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/testdata/fuzz
          key: fuzz-corpus-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.shard }}-

      # The cache ACTION only saves its post-step on job success — a crash
      # found late in the shard wrote its corpus into testdata but the
      # post-step SKIPPED it, so the next night re-discovered the same crash
      # instead of regressing on it (audit finding 2026-11-09). An explicit
      # save with if: always() closes the carryover gap.
      - name: Save fuzz corpora (even on failure)
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/testdata/fuzz
          key: fuzz-corpus-${{ matrix.shard }}-${{ github.run_id }}

      - name: Fuzz shard ${{ matrix.shard }}
        env:
          FUZZ_SECONDS: ${{ github.event.inputs.seconds || '60' }}
        run: bash scripts/fuzz-rotation.sh --shard "${{ matrix.shard }}/4"

      - name: Upload failure corpus on crash
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-corpus-shard-${{ matrix.shard }}
          path: |
            **/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 30
