name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"

env:
  GOEXPERIMENT: jsonv2

jobs:
  check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Check formatting
        run: nix fmt -- --fail-on-change

      - name: Build
        run: nix run .#build

      - name: Vet
        run: nix run .#vet

      - name: Test
        run: nix run .#test

      - name: Test with race detector
        run: nix run .#test-race

      - name: Lint
        run: nix run .#lint

      - name: API stability check
        run: nix run .#check-api-stability

      - name: Duplication check
        run: nix run .#check-duplication

      - name: Architecture check (layers + intra-module)
        run: nix run .#check-arch

      - name: Depguard check (go.mod vs depguard allow list)
        run: nix run .#check-depguard

      - name: Coverage drift check
        run: nix run .#check-coverage

      - name: CHANGELOG honesty gate
        run: bash scripts/check-changelog-symbols.sh

      - name: Heap-measurement contract
        run: bash scripts/check-heap-parallel.sh

      - name: Lint config check
        run: nix run .#check-lint-config

      - name: Doc cross-reference check
        run:
          cd cmd/doc-check && GOWORK=off go run -tags "goexperiment.jsonv2" .
      # No explicit args needed: auto-discovers repo root + all .agents/skills/*/references/*.md

      - name: Documentation assertions
        run: |
          # CHANGELOG must have exactly one [Unreleased]
          count=$(grep -cE '^## \[Unreleased\]' CHANGELOG.md)
          [ "$count" -eq 1 ] || { echo "::error::Found $count [Unreleased] sections (expected 1)"; exit 1; }
          # No stale module counts in core docs (dynamic whitelist)
          actual_count=$(find . -name go.mod -not -path './vendor/*' | wc -l)
          # Check "N go.mod files" patterns (unambiguously total count)
          # shellcheck disable=SC2016  # backticks are a regex, not command substitution
          grep -rnoE '\b[0-9]+\s*`?go\.mod`?\s*files?' --include='*.md' \
            README.md AGENTS.md FEATURES.md CONTRIBUTING.md docs/README.md \
            docs/v4-WISHLIST.md ROADMAP.md TODO_LIST.md 2>/dev/null \
            | grep -v 'archive/' \
            | grep -vE ":${actual_count}:" \
            | grep -vE ":${actual_count} " \
            && { echo "::error::Stale go.mod file count (expected $actual_count)"; exit 1; } || true
          # License must match: both LICENSE and README claim proprietary
          if ! head -1 LICENSE | grep -qi proprietary || ! grep -qi proprietary README.md; then
            echo "::error::License mismatch"; exit 1
          fi
          echo "All doc assertions passed"

      - name: Generate coverage
        run: nix run .#coverage

      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: coverage.out
          fail_ci_if_error: false

    timeout-minutes: 15

  shfmt-drift:
    name: Shell Format Drift (shfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      # The pre-commit hook only formats staged .sh files, so drift can creep
      # in from unstaged edits and other tools (root cause of the 4x map-key
      # mangling). This checks the whole scripts/ tree every push.
      - name: shfmt diff check on scripts/
        run: nix shell nixpkgs#shfmt --command shfmt -d scripts/

  cgo:
    name: CGo Build (DuckDB + Iroh QUIC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Build CGo modules (DuckDB + cqrs-bench duckdb factory)
        run: |
          nix develop -c bash -c '
            set -e
            CGO_ENABLED=1 go build -tags "goexperiment.jsonv2" ./stack/duckdb/...
            CGO_ENABLED=1 go build -tags "goexperiment.jsonv2" ./cmd/cqrs-bench/...
            CGO_ENABLED=1 go vet -tags "goexperiment.jsonv2" ./stack/duckdb/...
          '

      - name: Test DuckDB (CGo required)
        run: |
          nix develop -c bash -c '
            set -e
            cd stack/duckdb && GOWORK=off CGO_ENABLED=1 go test -tags "goexperiment.jsonv2" ./... -count=1
          '

      - name: Build + Test Iroh QUIC (CGo required, pre-compiled static lib)
        run: |
          nix develop -c bash -c '
            set -e
            CGO_ENABLED=1 go build -tags "goexperiment.jsonv2" ./metaengine/irohengine/quic/...
            CGO_ENABLED=1 go vet -tags "goexperiment.jsonv2" ./metaengine/irohengine/quic/...
            cd metaengine/irohengine/quic && GOWORK=off CGO_ENABLED=1 go test -tags "goexperiment.jsonv2" ./... -count=1
          '

  dgraph:
    name: Dgraph Integration (ephemeral)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      # Ephemeral nixpkgs Dgraph (Zero + Alpha), full dgraphengine suite,
      # teardown on exit. Same path as `nix run .#integration-dgraph`.
      - name: Run dgraphengine tests against ephemeral Dgraph
        run: nix run .#integration-dgraph

  quic-flake-watch:
    name: QUIC Convergence Flake Watch (-race x3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      # The Log order-tolerance fix landed 2026-08-15; running the convergence
      # suite three times under -race on every push surfaces recurrence early
      # instead of as one-off #verify flakes.
      - name: Convergence suite x3 under race
        run: |
          nix develop -c bash -c '
            set -e
            cd metaengine/irohengine/quic && GOWORK=off CGO_ENABLED=1 \
              go test -tags "goexperiment.jsonv2" -race -count=3 \
              -run TestQuicConvergenceSuite ./... -timeout=10m
          '

  verify-fast-gate:
    name: Verify (fast pre-merge gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Run verify-fast (build + vet + short tests + lint)
        run: nix run .#verify-fast

  per-module-test:
    name: Module ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover-modules.outputs.modules) }}
    needs: discover-modules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Test module in isolation
        run: (cd ${{ matrix.module }} && GOWORK=off go test -tags "goexperiment.jsonv2" ./... -count=1 -race)

    timeout-minutes: 15
  discover-modules:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Find all go.mod modules
        id: set-modules
        run: |
          modules=$(find . -name go.mod -not -path './vendor/*' \
            | sed 's|/go.mod||' | sed 's|^\./||' | sort \
            | jq -R . | jq -s -c .)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

    timeout-minutes: 15
  module-isolation:
    name: Module Isolation Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3
      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false
      - name: Verify every module builds under GOWORK=off
        run: nix run .#check-isolation

    timeout-minutes: 15
  cqrs-lint-self-lint:
    name: cqrs-lint Self-Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Run cqrs-lint on its own source (self-lint auto-detected)
        run: |
          cd cmd/cqrs-lint && GOWORK=off go run -tags "goexperiment.jsonv2" . . --strict-load --fail-on-stale-suppressions

    timeout-minutes: 15
  cqrs-lint-examples:
    name: cqrs-lint Examples (V007-silent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Lint every example — V007 (v5-removed APIs) must be silent
        run: |
          cd cmd/cqrs-lint
          status=0
          for ex in ../../example/*/; do
            echo "::group::Linting $ex"
            out=$(GOWORK=off go run -tags "goexperiment.jsonv2" . "$ex" 2>&1) || true
            echo "$out"
            if echo "$out" | grep -q "\[V007\]"; then
              echo "::error::V007 fired in $ex — examples are the copy-paste surface for consumers and must not use v5-removed APIs (AGENTS.md examples policy)"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

    timeout-minutes: 15
  doc-stub-check:
    name: Doc Stub Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3
      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false
      - name: Fail on placeholder doc.go stubs
        run: nix run .#check-doc-stubs

    timeout-minutes: 15
  coverage-gate:
    name: Minimum Coverage (80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Check per-package coverage >= 80%
        run: |
          pkgs=$(go list ./... | grep -v '/example/')
          failed=false
          for pkg in $pkgs; do
            output=$(go test -coverprofile=/dev/null -covermode=set "$pkg" 2>&1)
            pct=$(echo "$output" | grep -oP 'coverage: \K[0-9.]+')
            if [ -n "$pct" ]; then
              int_pct=$(echo "$pct" | cut -d. -f1)
              if [ "$int_pct" -lt 80 ]; then
                echo "::warning::$pkg coverage ${pct}% < 80%"
                failed=true
              else
                echo "  $pkg: ${pct}%"
              fi
            fi
          done
          if [ "$failed" = true ]; then
            echo "::error::One or more packages below 80% coverage"
            exit 1
          fi

    timeout-minutes: 15
  api-stability:
    name: API Stability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Verify API surface matches golden file
        run: cd cmd/api-stability && GOWORK=off go run -tags "goexperiment.jsonv2" .

    timeout-minutes: 15
  replace-directives:
    name: Replace Directives Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify go.mod replace directives match go.work
        run: bash scripts/check-replace-directives.sh

    timeout-minutes: 15
  go-work-sync:
    name: go.work sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Verify go.work is synced
        run: |
          # Gate: the committed go.work must stay CI-loadable. External
          # sibling use-entries (../go-*) break every plain-`go` job here —
          # co-dev against sibling repos belongs in a LOCAL, untracked
          # go.work (go.work.bak pattern), not in the committed one.
          if grep -qE '^[[:space:]]*\.\.\/' go.work; then
            echo "::error::go.work lists external sibling use-entries; CI has no ../ checkouts. Remove them (keep them in an untracked local go.work instead)."
            grep -nE '^[[:space:]]*\.\.\/' go.work
            exit 1
          fi
          cp go.work go.work.before
          go work sync
          if ! diff -q go.work.before go.work > /dev/null 2>&1; then
            echo "::error::go.work is out of sync. Run 'go work sync' and commit the changes."
            diff go.work.before go.work
            exit 1
          fi
          echo "go.work is synced"

    timeout-minutes: 15
  file-size-gate:
    name: File Size Check (max 350 lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check production files <= 350 lines
        run: |
          failed=false
          while IFS= read -r f; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 350 ]; then
              echo "::error::$f has $lines lines (max 350)"
              failed=true
            fi
          done < <(find . -name "*.go" -not -name "*_test.go" \
            -not -name "*.pb.go" \
            -not -name "*.gen.go" \
            -not -name "*_templ.go" \
            -not -path "*/example/*" \
            -not -path "*/testdata/*" \
            -not -path "*/internal/cattest/*" \
            -not -path "*/.git/*")
          if [ "$failed" = true ]; then
            echo "::error::One or more production files exceed 350 lines"
            exit 1
          fi

    timeout-minutes: 15
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Run benchmarks
        run: nix run .#bench 2>&1 | tee benchmark-results.txt

      # Regression enforcement lives in benchmarks.yml (regression job): a
      # median-based gate that fails the build. This job is informational.

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-results
          path: benchmark-results.txt
          retention-days: 30

    timeout-minutes: 15
  gosec:
    name: Security Scan (gosec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Run gosec on core modules
        run: |
          nix-shell -p gosec --run "gosec -fmt sarif -out gosec.sarif ./event/... ./command/... ./query/... ./decider/... ./storage/... ./middleware/... ./signing/... ./listing/... ./transport/http/..."

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec

    timeout-minutes: 15
  module-layers:
    name: Module Layer Architecture Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Verify module dependency layers
        run: bash scripts/check-module-layers.sh

      - name: Check version drift
        run: bash scripts/check-version-drift.sh

      - name: Check tag existence
        run: bash scripts/check-tag-existence.sh

    timeout-minutes: 15
  govulncheck:
    name: Vulnerability Check (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Run govulncheck
        run: |
          nix-shell -p go -p govulncheck --run \
            "govulncheck ./..."

    timeout-minutes: 15
  wasm-compile:
    name: WASM Compilation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Verify core modules compile to WASM
        run: |
          for mod in id codec dispatcher event command query decider; do
            echo "==> WASM build: $mod"
            (cd "$mod" && GOOS=js GOARCH=wasm GOWORK=off go build ./...)
          done

    timeout-minutes: 15
  postgres-integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cqrs
          POSTGRES_PASSWORD: cqrs
          POSTGRES_DB: cqrs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cqrs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgres://cqrs:cqrs@localhost:5432/cqrs_test?sslmode=disable
          POSTGRES_TEST_DSN: postgres://cqrs:cqrs@localhost:5432/cqrs_test?sslmode=disable
        run: |
          # Storage: event/command/query/snapshot stores + relational projections.
          # The relational test (storage/relational/pg_test.go) was previously
          # gated behind a postgres_integration tag that CI never passed — now
          # unified under -tags=integration.
          cd storage && GOWORK=off go test -tags=integration -v -count=1 \
            -run TestPostgres ./...
          # stack/postgres uses pgx directly (PgxListener + PostgresBus wiring).
          # -tags=integration enables the LISTEN/NOTIFY round-trip tests that
          # validate the full preset against a real Postgres instance.
          #
          # Locally (without POSTGRES_TEST_DSN), testcontainers-go spins up a
          # postgres:16-alpine container automatically — no manual setup needed.
          cd ../stack/postgres && GOWORK=off go test -tags=integration -v -count=1 ./...

    timeout-minutes: 15
  turso-sync:
    name: Turso Sync Tests
    runs-on: ubuntu-latest
    # Runs unconditionally; tests self-skip when TURSO_SYNC_URL is not set.
    # Set these secrets in repo settings to enable real sync validation:
    #   TURSO_SYNC_URL   — e.g. libsql://my-db.turso.io
    #   TURSO_SYNC_TOKEN — Turso auth token

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Run Turso sync contract tests
        env:
          TURSO_SYNC_URL: ${{ secrets.TURSO_SYNC_URL }}
          TURSO_SYNC_TOKEN: ${{ secrets.TURSO_SYNC_TOKEN }}
        run: |
          cd stack/turso && GOWORK=off go test -v -count=1 -run TestNewSync ./...

    timeout-minutes: 15
  skill-health:
    name: Skill Health (frontmatter + line-count + TOC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate Crush skill structure
        run: |
          set -e
          failed=false
          for skill_md in .agents/skills/*/SKILL.md; do
            skill_dir=$(dirname "$skill_md")
            skill_name=$(basename "$skill_dir")
            echo "==> Checking skill: $skill_name"

            # 1. YAML frontmatter present and well-formed (starts/ends with ---).
            head -1 "$skill_md" | grep -qx -- '---' || {
              echo "::error::$skill_md: missing YAML frontmatter opening ---"; failed=true; continue; }
            awk 'NR>1 && /^---$/{found=1; exit} END{ if(!found){ print "::error::'"$skill_md"': missing YAML frontmatter closing ---" > "/dev/stderr"; exit 1 } }' "$skill_md" || { failed=true; continue; }

            # 2. Required fields: name + description.
            frontmatter=$(awk 'NR==1{next} /^---$/{exit} {print}' "$skill_md")
            echo "$frontmatter" | grep -qE '^name:' || { echo "::error::$skill_md: missing 'name:' field"; failed=true; }
            echo "$frontmatter" | grep -qE '^description:' || { echo "::error::$skill_md: missing 'description:' field"; failed=true; }
            desc_len=$(echo "$frontmatter" | grep -E '^description:' | wc -c)
            [ "$desc_len" -lt 40 ] && { echo "::error::$skill_md: description too short (${desc_len} chars) — must be a real trigger"; failed=true; }

            # 3. Core SKILL.md should stay under 500 lines (skill-creator guideline).
            lines=$(wc -l < "$skill_md")
            if [ "$lines" -gt 500 ]; then
              echo "::error::$skill_md: ${lines} lines exceeds 500-line core guideline (split into references/)"
              failed=true
            fi
            echo "   core: ${lines} lines"
          done

          # 4. Reference files over 300 lines must include a table of contents.
          for ref in .agents/skills/*/references/*.md; do
            [ -f "$ref" ] || continue
            lines=$(wc -l < "$ref")
            if [ "$lines" -gt 300 ]; then
              grep -qiE '\*\*Contents|## (Contents|Table of Contents)|^- \[' "$ref" || {
                echo "::error::$ref: ${lines} lines but no table of contents (>300-line guideline)"
                failed=true
              }
            fi
            echo "   ref $(basename "$ref"): ${lines} lines"
          done

          if [ "$failed" = true ]; then
            echo "::error::Skill health checks failed"
            exit 1
          fi
          echo "✓ All skill health checks passed"
    timeout-minutes: 15
  catalog-golden-freshness:
    name: Catalog Golden File Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Verify catalog golden files are up-to-date
        run: |
          cd catalog
          GOWORK=off go test ./asyncapi/ ./eventcatalog/ ./openapi/ ./d2/ \
            -run TestGolden -count=1 -update 2>&1 | tee /dev/null
          if ! git diff --exit-code -- testdata/golden/; then
            echo "::error::Catalog golden files are stale. Run:"
            echo "::error::  cd catalog && GOWORK=off go test ./asyncapi/ ./eventcatalog/ ./openapi/ ./d2/ -run TestGolden -update"
            echo "::error::Then commit the refreshed golden files."
            git diff --stat -- testdata/golden/
            exit 1
          fi
          echo "✓ All catalog golden files are fresh"

    timeout-minutes: 15

  # NixOS VM-based integration tests — no Docker required.
  # Matrix runs PG and MySQL in parallel for faster CI feedback.
  nixos-vm-tests:
    name: NixOS VM Test (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, mysql, duckdb, turso]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: ${{ matrix.db }} VM test
        run: nix build .#checks.x86_64-linux.${{ matrix.db }}-vm -L

    timeout-minutes: 15

  # Ephemeral PostgreSQL integration tests — fastest path, no VM, no Docker.
  # Starts PG from nixpkgs in a temp dir and runs Go integration tests against it.
  ephemeral-pg-tests:
    name: Ephemeral PG Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Run PG integration tests via ephemeral PostgreSQL
        run: nix run .#integration-pg -- -short

    timeout-minutes: 10

  # Redis Streams broker tests — ephemeral nixpkgs redis, no Docker/VM.
  # Covers the watermill adapter edges gochannel cannot catch: Nack
  # redelivery, consumer-group exactly-once, 2 MiB payload integrity.
  redis-integration:
    name: Redis Broker Integration (ephemeral)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677268

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b
        # FlakeHub Cache requires registration now; keep the GitHub Actions
        # cache backend only (magic-nix-cache is deprecated upstream).
        with:
          use-flakehub: false

      - name: Run watermill broker tests via ephemeral Redis
        run: nix run .#integration-redis

    timeout-minutes: 10

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
