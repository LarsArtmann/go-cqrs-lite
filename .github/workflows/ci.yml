name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v17

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Check formatting
        run: nix fmt -- --fail-on-change

      - name: Build
        run: nix run .#build

      - name: Vet
        run: nix run .#vet

      - name: Test
        run: nix run .#test

      - name: Test with race detector
        run: nix run .#test-race

      - name: Lint
        run: nix run .#lint

      - name: Generate coverage
        run: nix run .#coverage

      - uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false

  per-module-test:
    name: Module ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - event
          - command
          - query
          - decider
          - id
          - dispatcher
          - schema
          - snapshot
          - codec
          - memory
          - catalog
          - middleware
          - integration
          - projection
          - signing
          - storage
          - watermill
          - encryption
          - listing
          - otel
          - pebble
          - turso
          - cmd/cqrs-gen
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v17

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Test module in isolation
        run: (cd ${{ matrix.module }} && GOWORK=off go test ./... -count=1 -race)

  coverage-gate:
    name: Minimum Coverage (80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v17

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Check per-package coverage >= 80%
        run: |
          pkgs=$(go list ./... | grep -v '/example/')
          failed=false
          for pkg in $pkgs; do
            output=$(go test -coverprofile=/dev/null -covermode=set "$pkg" 2>&1)
            pct=$(echo "$output" | grep -oP 'coverage: \K[0-9.]+')
            if [ -n "$pct" ]; then
              int_pct=$(echo "$pct" | cut -d. -f1)
              if [ "$int_pct" -lt 80 ]; then
                echo "::warning::$pkg coverage ${pct}% < 80%"
                failed=true
              else
                echo "  $pkg: ${pct}%"
              fi
            fi
          done
          if [ "$failed" = true ]; then
            echo "::error::One or more packages below 80% coverage"
            exit 1
          fi

  go-work-sync:
    name: go.work sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v17

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Verify go.work is synced
        run: |
          cp go.work go.work.before
          go work sync
          if ! diff -q go.work.before go.work > /dev/null 2>&1; then
            echo "::error::go.work is out of sync. Run 'go work sync' and commit the changes."
            diff go.work.before go.work
            exit 1
          fi
          echo "go.work is synced"

  file-size-gate:
    name: File Size Check (max 350 lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check production files <= 350 lines
        run: |
          failed=false
          find . -name "*.go" -not -name "*_test.go" -not -path "*/example/*" -not -path "*/testdata/*" | while read -r f; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 350 ]; then
              echo "::warning::$f has $lines lines (max 350)"
              failed=true
            fi
          done
          if [ "$failed" = true ]; then
            echo "::error::One or more production files exceed 350 lines"
            exit 1
          fi

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v17

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Run benchmarks
        run: nix run .#bench 2>&1 | tee benchmark-results.txt

      - name: Check for regressions (>2x slowdown vs main)
        run: |
          if git show origin/${{ github.base_ref || 'master' }}:benchmark-baseline.txt >/dev/null 2>&1; then
            echo "Baseline found, comparing..."
            git show origin/${{ github.base_ref || 'master' }}:benchmark-baseline.txt > baseline.txt
            grep -E '^Benchmark' benchmark-results.txt | while read -r line; do
              name=$(echo "$line" | awk '{print $1}')
              ns=$(echo "$line" | awk '{print $3}')
              base_ns=$(grep "^${name} " baseline.txt 2>/dev/null | awk '{print $3}')
              if [ -n "$base_ns" ] && [ -n "$ns" ]; then
                ratio=$(echo "scale=2; $ns / $base_ns" | bc)
                echo "  $name: ${ns}ns (baseline: ${base_ns}ns, ratio: ${ratio}x)"
                threshold=$(echo "$ratio > 2.0" | bc)
                if [ "$threshold" -eq 1 ]; then
                  echo "::warning::$name regressed ${ratio}x vs baseline (${base_ns}ns → ${ns}ns)"
                fi
              fi
            done
          else
            echo "No baseline found. Skipping comparison."
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt
          retention-days: 30

  gosec:
    name: Security Scan (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v17

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Run gosec on core modules
        run: |
          nix-shell -p gosec --run "gosec -fmt sarif -out gosec.sarif -no-fail ./event/... ./command/... ./query/... ./decider/... ./storage/... ./middleware/... ./projection/... ./signing/... ./listing/..."

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec

  module-layers:
    name: Module Layer Architecture Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v17

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Verify module dependency layers
        run: bash scripts/check-module-layers.sh
