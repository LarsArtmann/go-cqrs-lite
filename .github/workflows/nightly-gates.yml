# Nightly self-heal gates + calibration-baseline loop.
#
# The "self-heal only works when the gate runs" meta-fix (TODO 08-05 §b3): the
# depguard block stayed deleted for ~4 days twice purely because no gate ran
# between auto-commit waves. This workflow runs the cheap config gates daily
# so a corruption incident surfaces within 24h, and closes the one-workflow-
# away calibration artifact loop (night N writes the baseline, night N+1
# compares against it).
#
# Cache policy: deliberately NO magic-nix-cache-action — it is the throttled
# dependency that red the entire CI matrix (2026-09-13 triage); scheduled jobs
# benefit least from caching. When the FlakeHub account decision lands, add
# flakehub-cache-action here first.
name: Nightly Gates

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC, daily
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-gates
  cancel-in-progress: true

jobs:
  gates:
    name: Self-heal gates + calibration loop
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa

      - name: Nightly date
        id: date
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "dow=$(date -u +%u)" >> "$GITHUB_OUTPUT"

      # Rolling baseline: today's key, restore-keys falls back to the most
      # recent night's artifact (the N-1 baseline the compare step wants).
      # SHA verified 2026-09-18 via `git ls-remote --tags`: = actions/cache v4.2.0.
      - name: Restore previous calibration baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/calibration-baseline.txt
          key: calib-${{ steps.date.outputs.date }}
          restore-keys: |
            calib-

      - name: Lint config self-heal (gci pin + depguard golden)
        run: |
          nix run .#check-lint-config

          if ! git diff --exit-code -- .golangci.yml; then
            echo "::error::lint-config self-heal REPAIRED .golangci.yml - the committed config was corrupted (gci/depguard class). Diff above must be applied to the repo."
            git diff -- .golangci.yml
            exit 1
          fi

      # W3 Q4 ruling (2026-09-20): the go.work contract vs the selected
      # toolchain must be checked loudly on a schedule — the GOTOOLCHAIN=auto
      # env chain is the contract until nixpkgs pins 1.27.1.
      - name: Go version contract
        run: nix run .#check-go-version

      - name: Module sums (go.mod tidiness across all modules)
        run: nix run .#check-modsums

      - name: Release-script harnesses (incl. pin-sweep fixtures)
        run: nix run .#check-release-scripts

      # Number-rot class: "<N> go.mod files" / "<N>/<N> classified" /
      # module-map census must match repo-derived truth, not memory
      # (both had drifted by 2026-09-20). Self-test first, then the gate.
      - name: Canonical-facts gate (docs numbers vs repo truth)
        run: |
          bash scripts/check-canonical-facts.sh --self-test
          bash scripts/check-canonical-facts.sh

      # Archived reports must carry a resolution marker (banner or
      # strikethrough) or sit in the conscious pre-convention baseline;
      # live reports older than 14d without KEEP-LIVE surface as drift.
      - name: Doc-annotations gate (archived-report markers)
        run: |
          bash scripts/check-doc-annotations.sh --self-test
          bash scripts/check-doc-annotations.sh

      # README integrity: every relative link target must resolve (673 links
      # verified at introduction), and deprecated symbols must not be cited
      # as living API without a banner — historical mentions sit in
      # scripts/readme-deprecated-baseline.txt and shrink as ADR-0123
      # banners land (only shrinkage is legitimate growth direction).
      - name: README links gate (all module READMEs)
        run: |
          bash scripts/check-readme-links.sh --self-test
          bash scripts/check-readme-links.sh

      - name: README deprecated-citations gate
        run: |
          bash scripts/check-readme-deprecated.sh --self-test
          bash scripts/check-readme-deprecated.sh

      # Reverse changelog gate: every module in the api golden must be
      # mentioned in CHANGELOG.md; NEW unmentioned headline exports fail
      # (513 pre-existing entries baselined 2026-09-25; the mesh-demo/E019/
      # docserver miss class stayed green through the old one-way gate).
      - name: Changelog coverage gate (reverse)
        run: |
          bash scripts/check-changelog-coverage.sh --self-test
          bash scripts/check-changelog-coverage.sh --fail-on-new

      # md-go gate: every live ```go fence in docs must parse (or carry
      # // skip-validate); frozen history baselined in
      # scripts/md-go-baseline.txt (inert-shrink ratchet). Self-test first,
      # then the real gate — same pattern as the gates above.
      - name: md-go validator gate (docs go fences)
        run: |
          bash scripts/check-md-go.sh --self-test
          bash scripts/check-md-go.sh

      # Report-only per the 2026-09-18 trigger-policy decision: push-blocking
      # stays on the per-push CI leg; the nightly only surfaces drift.
      - name: Pin sweep (report-only)
        run: |
          if ! bash scripts/pin-sweep.sh --check --remote; then
            echo "::warning::pin-sweep drift detected (report-only on nightly; blocking gate remains in ci.yml)"
          fi

      - name: Calibration drift compare (vs previous night)
        if: hashFiles('build/calibration-baseline.txt') != ''
        run: nix run .#calibration-drift -- --baseline build/calibration-baseline.txt

      - name: Calibration baseline refresh (tonight's numbers)
        run: nix run .#calibration-drift -- --write-baseline build/calibration-baseline.txt

      # Weekly (Sundays, UTC): the published-tag surface probe — proxy
      # resolves every module's latest tag and the zip is REAL (the
      # poisoned-tag class ships silently otherwise; the tag-release
      # zip-content guard protects FUTURE tags only).
      - name: Proxy tag probe (Sundays)
        if: ${{ github.event_name == 'schedule' && steps.date.outputs.dow == '7' }}
        run: |
          bash scripts/probe-proxy-tags.sh --self-test
          bash scripts/probe-proxy-tags.sh
