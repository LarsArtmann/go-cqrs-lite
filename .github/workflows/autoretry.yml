# One automatic retry for infrastructure-transient failures: when CI or
# Nightly Gates fails on attempt 1, re-run ONLY the failed jobs once. The
# attempt==1 guard is the loop bound — a second failure stands, so flaky
# tests get no extra chances and billing sees at most one extra partial run.
name: Autoretry

on:
  workflow_run:
    workflows: [CI, Nightly Gates]
    types: [completed]

permissions:
  actions: write

jobs:
  retry-failed-jobs-once:
    name: Rerun failed jobs (once)
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    steps:
      - name: Re-run failed jobs of the failed run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          echo "Run $REPO#$RUN_ID (attempt 1) failed; re-running failed jobs once."
          gh api -X POST "/repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
