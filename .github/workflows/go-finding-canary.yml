# go-finding canary — weekly + manual drift check.
#
# Runs cqrs-lint's pinned-behavior suites against go-finding@master instead of
# the released tag, so an upstream regression or breaking change surfaces here
# (a small weekly fire) instead of at the next release bump (a big surprise).
#
# NOTE: the scheduled leg ran red for four consecutive weeks (2026-10-12 →
# 2026-11-09) on a broken relative path (../ vs ../../) before this file was
# fixed — if it is red again, check the checkout path first, then whether a
# pin-behavior test legitimately caught upstream drift.
#
# The replace directives point every go-finding module at one master checkout
# (master is a multi-module repo: core, pipeline, analysis, toolsdk,
# cmd/go-finding). Tests run with GOWORK=off so the overrides are what resolve.
name: go-finding-canary

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC — off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

# Weekly canary is short; a newer run supersedes an in-flight one.
concurrency:
  group: go-finding-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"

      - name: Check out go-finding@master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LarsArtmann/go-finding
          ref: master
          path: go-finding-master

      - name: Point cqrs-lint at go-finding@master
        working-directory: cmd/cqrs-lint/v4
        run: |
          # actions/checkout path is relative to $GITHUB_WORKSPACE, so from
          # cmd/cqrs-lint/v4 the sibling checkout lives two levels up.
          MASTER="$(cd ../../go-finding-master && pwd)"
          go mod edit \
            -replace=github.com/larsartmann/go-finding="$MASTER" \
            -replace=github.com/larsartmann/go-finding/pipeline="$MASTER/pipeline"
          go mod tidy

      - name: Build + test against master
        working-directory: cmd/cqrs-lint/v4
        run: |
          GOWORK=off go build ./...
          GOWORK=off go test -count=1 . ./pkg/...

      - name: Report drift
        if: failure()
        run: |
          echo "::error::cqrs-lint fails against go-finding@master — a pin or a pin-behavior test (correlate_test.go, fix_report_test.go) needs attention before the next go-finding bump."
          exit 1
