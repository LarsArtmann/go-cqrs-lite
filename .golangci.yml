          - godoclint
    paths:
      - \.gen\.go$
      - \.pb\.go$
      - _templ\.go$
      - event/v4/
      - event/v4/eventtest/
      - fake_.*\.go$
      - metaengine/sqliteengine/v4/
      - storage/v4/view/
      - vendor/
formatters:
  enable:
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - \.pb\.go$
      - _templ\.go$
      - event/v4/
      - event/v4/eventtest/
      - fake_.*\.go$
      - metaengine/sqliteengine/v4/
      - storage/v4/view/
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
