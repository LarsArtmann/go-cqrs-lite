version: "2"
run:
  timeout: 5m
  go: 1.26.1
  build-tags:
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - noinlineerr
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wsl_v5
    - zerologlint
  default: none
  settings:
    cyclop:
      max-complexity: 25
    funlen:
      lines: 200
      statements: 100
    gocognit:
      min-complexity: 35
    depguard:
      rules:
        Main:
          allow:
            - $gostd
            - github.com/larsartmann/go-cqrs-lite
            - github.com/google/uuid
            - github.com/cockroachdb/errors
            - github.com/go-json-experiment/json
            - github.com/go-faster/yaml
            - github.com/onsi/ginkgo
            - github.com/onsi/gomega
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: unused-parameter
          disabled: false
    varnamelen:
      check-return: false
      check-receiver: false
      ignore-names:
        - id
        - r
        - t
        - tb
        - tt
        - ip
        - i
        - ok
        - wg
        - err
        - d
        - p
        - m
        - v
        - e
        - s
        - o
        - c
        - k
        - b
        - f
        - n
        - ctx
        - tc
        - op
        - md
        - ch
        - l
        - lc
        - h
        - q
        - fn
    wrapcheck:
      local-prefixes:
        - github.com/larsartmann/go-cqrs-lite
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  exclude-rules:
    - linters:
        - err113
      path: _test\.go$
    - linters:
        - wrapcheck
      path: _test\.go$
formatters:
