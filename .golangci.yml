# golangci-lint v2 config — per-module invocations run from each module dir
# (flake #lint + scripts/lint-scope.sh); exclusion `path:` values match FULL
# repo-relative paths.
#
# Exclusion-row taxonomy (2026-11-21 red-set campaign, 34 modules → 0):
#   1. DeferClose false positives — sqlclosecheck cannot see through
#      record.DeferClose/metaengine.DeferClose (ADR-0144); per-module rows
#      where the idiom is used (mysql/duckdb/pg engines, storage/v4, turso).
#   2. Driver boundaries — wrapcheck ignore-sigs for KV/graph/SQL drivers and
#      first-party storage delegation; the adapter IS the boundary.
#   3. Option/config structs — exhaustruct_v5 ignore-patterns for functional-
#      option types and driver options where zero values are the defaults.
#   4. Schema DATA tables — gochecknoglobals rows for reset/typed_wal tables
#      that migrate with the DDL, keycodec seams, CBOR codec modes.
#   5. Deprecated-surface bridges — SA1019 text rows citing the ADR
#      (ADR-0123 stack presets + storage/turso connector; core/v5 twins D32).
#   6. Frozen wire contracts — tagliatelle json BOTH-case exclusions.
# Every row carries its reason inline; prefer a code fix to a new row.
version: "2"
run:
  timeout: 5m
  go: "1.27"
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  default: none
  settings:
    depguard:
      rules:
        main-allow-list:
          allow:
            - $gostd
            - github.com/larsartmann/go-cqrs-lite
            - github.com/larsartmann/go-retry
            - github.com/larsartmann/go-idempotency
            - github.com/larsartmann/go-codec
            - github.com/larsartmann/go-composable-business-types
            - github.com/larsartmann/go-branded-id
            - github.com/larsartmann/go-sse
            - github.com/larsartmann/go-sqlitestore
            # First-party, used by example/taskmanager's system-query HTTP
            # binding dogfood (2026-10-16); allow-list caught up 2026-10-17.
            - github.com/larsartmann/go-etag/server
            - github.com/larsartmann/httputil
            - github.com/google/uuid
            - github.com/cockroachdb/errors
            - github.com/go-json-experiment/json
            - github.com/go-faster/yaml
            - gopkg.in/yaml
            - github.com/oklog/ulid
            - github.com/DATA-DOG/go-sqlmock
            - github.com/stretchr/testify
            - github.com/onsi/ginkgo
            - github.com/onsi/gomega
            - go.opentelemetry.io/otel
            - github.com/cockroachdb/pebble
            - github.com/larsartmann/go-error-family
            - github.com/larsartmann/go-flightrecorder
            - github.com/larsartmann/go-must
            - modernc.org/sqlite
            - github.com/mattn/go-sqlite3
            - turso.tech/database/tursogo
            - github.com/ThreeDotsLabs/watermill
            - github.com/ThreeDotsLabs/watermill-nats/v2
            - github.com/nats-io/nats.go
            - github.com/redis/go-redis/v9
            - github.com/samber/ro
            - github.com/samber/lo
            - github.com/fxamacker/cbor
            - github.com/gkampitakis/go-snaps
            - pgregory.net/rapid
            - go.uber.org/goleak
            - github.com/testcontainers/testcontainers-go
            - go/ast
            - go/format
            - go/parser
            - go/token
            - go/types
            - golang.org/x/tools
            - golang.org/x/crypto
            - golang.org/x/sync
            - github.com/prometheus/client_golang
            - github.com/prometheus/client_model
            - github.com/maypok86/otter
            - github.com/failsafe-go/failsafe-go
            - github.com/jackc/pgx
            - github.com/go-sql-driver/mysql
            - github.com/duckdb/duckdb-go
            - github.com/dustin/go-humanize
            - cloud.google.com/go/bigtable
            - google.golang.org/api
            - google.golang.org/grpc
            - google.golang.org/protobuf
            - github.com/larsartmann/go-finding
            - github.com/larsartmann/cmdguard
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            - charm.land
            - github.com/charmbracelet
            - github.com/samber/do
            - github.com/samber/go-type-to-string
            - github.com/knadh/koanf
            - github.com/larsartmann/go-output
            - github.com/LarsArtmann/gogenfilter
            - github.com/larsartmann/templ-components
            - github.com/a-h/templ
            - github.com/bmatcuk/doublestar
            - github.com/clipperhouse
            - github.com/lucasb-eyer/go-colorful
            - github.com/mattn/go-runewidth
            - github.com/muesli
            - github.com/pelletier/go-toml
            - github.com/rivo/uniseg
            - github.com/segmentio/asm
            - github.com/xo/terminfo
            - go.uber.org/multierr
            - github.com/inconshreveable/mousetrap
            - git.coopcloud.tech/decentral1se/iroh-go
            - github.com/tursodatabase/turso-go-platform-libs
            - github.com/dgraph-io/dgo/v240
            - github.com/dgraph-io/badger/v4
            - go.etcd.io/bbolt
            - golang.org/x/mod
            - golang.org/x/term
    cyclop:
      max-complexity: 25
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (net.Conn).Close
        - (*net.TCPConn).Close
        - (*net.UDPConn).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - (*strings.Builder).WriteString
        - (*bytes.Buffer).WriteString
    exhaustruct_v5:
      ignore-patterns:
        - os/exec.Cmd
        - go.etcd.io/bbolt.Options
        - github.com/larsartmann/go-cqrs-lite/stack/v4.Capabilities
        - github.com/larsartmann/go-cqrs-lite/queue/v4/task.New
        - github.com/larsartmann/go-cqrs-lite/queue/v4/task.Task
        - github.com/larsartmann/go-cqrs-lite/queue/v4.Filter
        - github.com/larsartmann/go-cqrs-lite/queue/v4/facts.Fact
        - github.com/larsartmann/go-cqrs-lite/metaengine/v4\.EngineProfile
        - github.com/larsartmann/go-cqrs-lite/storage/v4/pebble\.storeBase
        - github.com/larsartmann/go-cqrs-lite/storage/v4/bbolt\.storeBase
        # Preset option-pattern structs (deprecated at v5, ADR-0123):
        # functional options default every omitted field by design.
        - github.com/larsartmann/go-cqrs-lite/stack/pebble/v4\.config
        - github.com/larsartmann/go-cqrs-lite/stack/turso/v4\.config
        - github.com/larsartmann/go-cqrs-lite/stack/turso/v4\.Bundle
        # Stdlib/driver option structs: omitted fields are zero-value
        # options by the driver's own semantics.
        - github.com/cockroachdb/pebble\.IterOptions
        - github.com/dgraph-io/dgo/v240/protos/api\.Mutation
        - github.com/dgraph-io/dgo/v240/protos/api\.Request
        - github.com/dgraph-io/dgo/v240/protos/api\.Operation
        - github.com/dgraph-io/badger/v4\.IteratorOptions
        # tursogo sync config: functional SyncOptions default every omitted
        # field; the driver's zero values are the documented defaults.
        - turso\.tech/database/tursogo\.TursoSyncDbConfig
        # indexing.Advisor's mu/existing/excluded zero values are the
        # armed-by-construction state (sync.RWMutex + nil-map guards).
        - github.com/larsartmann/go-cqrs-lite/storage/turso/v4/indexing\.Advisor
        # First-party option/optional-field structs: functional options or
        # documented optional stamps default every omitted field.
        - github.com/larsartmann/go-cqrs-lite/metaengine/v4\.LayoutPlan
        - github.com/larsartmann/go-cqrs-lite/metaengine/v4\.AggregateSpec
        - github.com/larsartmann/go-cqrs-lite/event/v4\.eventOptions
        - github.com/larsartmann/go-cqrs-lite/event/v4\.Checkpoint
        - github.com/larsartmann/go-cqrs-lite/record/v4\.CommonMetadata
        - github.com/larsartmann/go-cqrs-lite/snapshot/v4\.Snapshot
        - github.com/larsartmann/go-cqrs-lite/storage/turso/v4/indexing\.Index
        - github.com/larsartmann/go-cqrs-lite/storage/bbolt/v4\.bboltEventIterator
        # LogStore's mutex/log slice zero values are correct by design.
        - github.com/larsartmann/go-cqrs-lite/storage/memory/v4\.LogStore
        # Optional-result seams: SearchResult.Score is zero for unranked
        # results; the transientCommitError compile-proof intentionally
        # constructs the zero value (the marker interface holds without err).
        - github.com/larsartmann/go-cqrs-lite/metaengine/v4\.SearchResult
        - github.com/larsartmann/go-cqrs-lite/metaengine/dgraphengine/v4\.transientCommitError
        # KV-engine scan/config seams: ScanResult.NextCursor is optional
        # (absent = single page); engineConfig fields are functional-option
        # defaults.
        - github.com/larsartmann/go-cqrs-lite/metaengine/v4\.ScanResult
        - github.com/larsartmann/go-cqrs-lite/metaengine/bboltengine/v4\.engineConfig
        - github.com/larsartmann/go-cqrs-lite/metaengine/pebbleengine/v4\.engineConfig
        # storage/pebble + storage/bbolt stores: shard slices, lock shards,
        # iterator/batch state, and closed flags initialize lazily on first
        # use — zero values are the armed-by-construction state.
        - github.com/larsartmann/go-cqrs-lite/storage/pebble/v4\.KVAdapter
        - github.com/larsartmann/go-cqrs-lite/storage/pebble/v4\.pebbleBatch
        - github.com/larsartmann/go-cqrs-lite/storage/pebble/v4\.backendConfig
        - github.com/larsartmann/go-cqrs-lite/storage/pebble/v4\.CheckpointStore
        - github.com/larsartmann/go-cqrs-lite/storage/pebble/v4\.CommandStore
        - github.com/larsartmann/go-cqrs-lite/storage/pebble/v4\.QueryStore
        - github.com/larsartmann/go-cqrs-lite/storage/pebble/v4\.SnapshotStore
        - github.com/larsartmann/go-cqrs-lite/storage/pebble/v4\.EventStore
        - github.com/larsartmann/go-cqrs-lite/storage/pebble/v4\.pebbleEventIterator
        - github.com/larsartmann/go-cqrs-lite/storage/bbolt/v4\.backendOptions
        - github.com/larsartmann/go-cqrs-lite/storage/bbolt/v4\.CheckpointStore
        - github.com/larsartmann/go-cqrs-lite/storage/bbolt/v4\.CommandStore
        - github.com/larsartmann/go-cqrs-lite/storage/bbolt/v4\.KVAdapter
        - github.com/larsartmann/go-cqrs-lite/storage/bbolt/v4\.bboltBatch
        - github.com/larsartmann/go-cqrs-lite/storage/bbolt/v4\.bboltIterator
        - github.com/larsartmann/go-cqrs-lite/storage/bbolt/v4\.batchOp
        - github.com/larsartmann/go-cqrs-lite/storage/bbolt/v4\.QueryStore
        - github.com/larsartmann/go-cqrs-lite/storage/bbolt/v4\.SnapshotStore
        - github.com/larsartmann/go-cqrs-lite/storage/bbolt/v4\.EventStore
        # loopback/quic transports: lazy subscriber/latency state and
        # optional percentiles (absent = not yet measured).
        - github.com/larsartmann/go-cqrs-lite/metaengine/irohengine/loopback/v4\.config
        - github.com/larsartmann/go-cqrs-lite/metaengine/irohengine/loopback/v4\.LoopbackTransport
        - github.com/larsartmann/go-cqrs-lite/metaengine/irohengine/v4\.LatencySnapshot
        - github.com/larsartmann/go-cqrs-lite/metaengine/irohengine/quic/v4\.peerConn
        - github.com/larsartmann/go-cqrs-lite/metaengine/irohengine/quic/v4\.config
        - github.com/larsartmann/go-cqrs-lite/metaengine/irohengine/quic/v4\.QuicTransport
        - github.com/larsartmann/go-cqrs-lite/metaengine/bigtableengine/v4\.Family
        # Google Cloud Bigtable SDK admin/read shapes: omitted fields are
        # the SDK's documented defaults (families, retention, labels).
        - cloud\.google\.com/go/bigtable\.TableConf
        - cloud\.google\.com/go/bigtable\.ReadItem
        - cloud\.google\.com/go/bigtable\.Family
        # CellVersion.Value is optional — zero = tombstone/absent value.
        - github.com/larsartmann/go-cqrs-lite/metaengine/v4\.CellVersion
        # RawScanResult/kvPair: NextCursor and raw bytes are optional
        # (absent = single page / no raw echo).
        - github.com/larsartmann/go-cqrs-lite/metaengine/v4\.RawScanResult
        - github.com/larsartmann/go-cqrs-lite/metaengine/pebbleengine/v4\.kvPair
        # Hooks fields are optional observability seams (nil = unobserved);
        # Observer partially fills only the metric hooks it tracks.
        - github.com/larsartmann/go-cqrs-lite/metaengine/v4\.Hooks
        - github.com/larsartmann/go-cqrs-lite/metaengine/otelobserver/v4\.Observer
        # projectionadapter.Adapter embeds and forwards — its optional
        # event-type filter and error hooks default to pass-through.
        - github.com/larsartmann/go-cqrs-lite/metaengine/projectionadapter/v4\.Adapter
        # Engine constructors (2026-11-21 red-set campaign): engines
        # initialize lazily — mutexes, done channels, caches, and observer
        # fields are zero-by-design and armed on first use. Exhaustive
        # literals would initialize synchronization primitives that are
        # correct only in their zero state.
        - github.com/larsartmann/go-cqrs-lite/metaengine/pgengine/v4\.pgEngine
        - github.com/larsartmann/go-cqrs-lite/metaengine/mysqlengine/v4\.mysqlEngine
        - github.com/larsartmann/go-cqrs-lite/metaengine/duckdbengine/v4\.duckdbEngine
        - github.com/larsartmann/go-cqrs-lite/metaengine/dgraphengine/v4\.dgraphEngine
        - github.com/larsartmann/go-cqrs-lite/metaengine/bboltengine/v4\.bboltEngine
        - github.com/larsartmann/go-cqrs-lite/metaengine/badgerengine/v4\.badgerEngine
        - github.com/larsartmann/go-cqrs-lite/metaengine/pebbleengine/v4\.pebbleEngine
        - github.com/larsartmann/go-cqrs-lite/metaengine/bigtableengine/v4\.bigtableEngine
        - github.com/larsartmann/go-cqrs-lite/metaengine/bigtableengine/v4\.TableConf
        - github.com/larsartmann/go-cqrs-lite/metaengine/bigtableengine/v4\.ReadItem
        - github.com/larsartmann/go-cqrs-lite/metaengine/pebbleengine/v4\.sortIndexHit
        # typedStreamRow scan rows (pg/mysql/duckdb): omitted columns are
        # NULLABLE SQL columns — zero values are the absent-column contract.
        - github.com/larsartmann/go-cqrs-lite/metaengine/pgengine/v4\.typedStreamRow
        - github.com/larsartmann/go-cqrs-lite/metaengine/mysqlengine/v4\.typedStreamRow
        - github.com/larsartmann/go-cqrs-lite/metaengine/duckdbengine/v4\.typedStreamRow
        # metaengine option/report structs: optional fields default per the
        # live-latency model (priors replaced by calibration/measurement).
        - github.com/larsartmann/go-cqrs-lite/metaengine/v4\.StreamLogEntry
        - github.com/larsartmann/go-cqrs-lite/metaengine/v4\.CalibrationCosts
        # storage driver option structs and lazy iterators.
        - github.com/cockroachdb/pebble\.Options
        - github.com/cockroachdb/pebble\.KVAdapter
        - github.com/cockroachdb/pebble\.EventStore
        - github.com/fxamacker/cbor/v2\.EncOptions
        - github.com/fxamacker/cbor/v2\.DecOptions
        # iroh-go driver option structs: zero-value fields are the driver's
        # documented defaults (same class as the pebble/badger options).
        - git\.coopcloud\.tech/decentral1se/iroh-go\.EndpointOptions
        - go.etcd.io/bbolt\.KVAdapter
        - github.com/larsartmann/go-cqrs-lite/storage/turso/v4\.TursoSyncDbConfig
        - github.com/larsartmann/go-cqrs-lite/storage/turso/v4/indexing\.AutoIndexer
        - github.com/larsartmann/go-cqrs-lite/storage/turso/v4/indexing\.CheckpointScheduler
        - github.com/larsartmann/go-cqrs-lite/storage/pebble/v4\.pebbleIterator
        # stdlib config structs: zero fields are documented defaults.
        - net\.ListenConfig
        - net\.Dialer
    funlen:
      lines: 200
      statements: 100
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocognit:
      min-complexity: 35
    goconst:
      ignore-tests: true
      min-len: 4
      min-occurrences: 5
    gocritic:
      disabled-checks:
        - ifElseChain
    gocyclo:
      min-complexity: 20
    gomoddirectives:
      replace-local: true
    gosec:
      excludes:
        - G304
        - G115
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
        # The library's public API IS interface contracts (see the
        # Interface Hierarchy in DOMAIN_LANGUAGE.md): constructors and
        # stores return Engine/EventIterator/Store/Span/Tracer by design;
        # concrete returns would leak implementations to consumers.
        - github.com/larsartmann/go-cqrs-lite/.*
    makezero:
      always: false
    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "100"
        # File-permission idioms: 0o600/0o750 are self-documenting.
        - "0o600"
        - "0o750"
        - "0o644"
        - "0o755"
    nestif:
      min-complexity: 6
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
        - disabled: false
          name: unused-parameter
    tagalign:
      align: false
      order:
        - binding
        - json
        - yaml
        - xml
        - toml
        - validate
        - mapstructure
      sort: true
    tagliatelle:
      case:
        use-field-name: true
        # NOTE: no json entry (2026-11-21): the v4 train's wire is frozen
        # in BOTH cases — the snake majority AND camelCase persisted-event
        # payloads (commandlifecycle events, snapshot wire legacy rows,
        # engine metadata, catalog docs; 151 findings under `json: snake`,
        # mixed within single files). On a byte-frozen train no tag-case
        # change is actionable (any rename breaks decoding of stored
        # events), so the json case judgment is scoped out entirely via the
        # exclusion rule below — tagliatelle still polices the other tag
        # families. A uniform json case policy belongs to NEW surface
        # (core/v5 + the v5 cut). (`rules: {}` cannot express this — empty
        # rules silently restore defaults; `json: ignore` is unsupported.)
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      check-receiver: false
      check-return: false
      ignore-names:
        - g
        - id/v4
        - r
        - t
        - w
        - tb
        - tt
        - ip
        - i
        - ok
        - wg
        - err
        - d
        - p
        - m
        - v
        - e
        - s
        - o
        - c
        - k
        - b
        - f
        - "n"
        - ctx
        - tc
        - op
        - md
        - ch
        - l
        - lc
        - h
        - q
        - uc
        - fn
        - tx
        - mw
        - ts
        - mu
        - rs
        - j
        - db
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - .NewRejection(
        - .NewTransient(
        - .NewInfrastructure(
        - .NewCorruption(
        - .NewConflict(
        - .NewOrchestration(
        - .Newf(
        - .WrapRejection(
        - .WrapTransient(
        - .WrapInfrastructure(
        - .WrapCorruption(
        - .WrapConflict(
        - .WrapOrchestration(
        - .WithCause(
        - .Scan(
        - (*database/sql.Rows).Err
        - (*database/sql.DB).Query
        - (*database/sql.DB).Exec
        - (*database/sql.DB).Close
        - (*database/sql.DB).BeginTx
        - (*database/sql.Tx).Query
        - (*database/sql.Tx).Exec
        - (*database/sql.Tx).Commit
        - Result).RowsAffected(
        - (*github.com/jackc/pgx/v5/pgxpool.Pool).Query
        - (*github.com/jackc/pgx/v5/pgxpool.Pool).Exec
        - (*github.com/jackc/pgx/v5/pgxpool.Pool).Begin
        - (github.com/jackc/pgx/v5.Tx).Query
        - (github.com/jackc/pgx/v5.Tx).Exec
        - (github.com/jackc/pgx/v5.Tx).Commit
        - (github.com/jackc/pgx/v5.Rows).Err
        # KV/graph driver boundaries (2026-11-21 red-set campaign): the
        # engines ARE thin adapters over these drivers — a driver error IS
        # the engine error; classification happens where context exists
        # (metaengine core), not at every delegation line.
        - (*go.etcd.io/bbolt.DB).Close
        - (*github.com/dgraph-io/badger/v4.DB).Update
        - (*github.com/dgraph-io/badger/v4.DB).View
