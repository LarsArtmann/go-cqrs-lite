version: "2"
run:
  timeout: 5m
  go: 1.26.4
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  default: none
  settings:
    cyclop:
      max-complexity: 25
    depguard:
      rules:
        Main:
          allow:
            - $gostd
            - github.com/larsartmann/go-cqrs-lite
            - github.com/larsartmann/go-retry
            - github.com/larsartmann/go-idempotency
            - github.com/larsartmann/go-composable-business-types
            - github.com/larsartmann/go-branded-id
            - github.com/larsartmann/go-sse
            - github.com/google/uuid
            - github.com/cockroachdb/errors
            - github.com/go-json-experiment/json
            - github.com/go-faster/yaml
            - gopkg.in/yaml
            - github.com/oklog/ulid
            - github.com/DATA-DOG/go-sqlmock
            - github.com/stretchr/testify
            - github.com/onsi/ginkgo
            - github.com/onsi/gomega
            - go.opentelemetry.io/otel
            - github.com/cockroachdb/pebble
            - github.com/larsartmann/go-error-family
            - github.com/larsartmann/go-must
            - modernc.org/sqlite
            - github.com/mattn/go-sqlite3
            - turso.tech/database/tursogo
            - github.com/ThreeDotsLabs/watermill
            - github.com/samber/ro
            - github.com/samber/lo
            - github.com/fxamacker/cbor
            - github.com/gkampitakis/go-snaps
            - pgregory.net/rapid
            - github.com/testcontainers/testcontainers-go
            - go/ast
            - go/format
            - go/parser
            - go/token
            - go/types
            - golang.org/x/tools
            - golang.org/x/crypto
            - golang.org/x/sync
            - github.com/prometheus/client_golang
            - github.com/prometheus/client_model
            - github.com/maypok86/otter
            - github.com/failsafe-go/failsafe-go
            - github.com/jackc/pgx
            - github.com/go-sql-driver/mysql
            - github.com/duckdb/duckdb-go
            - github.com/dustin/go-humanize
            - google.golang.org/grpc
            - google.golang.org/protobuf
            - github.com/larsartmann/go-finding
            - github.com/larsartmann/cmdguard
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            - charm.land
            - github.com/charmbracelet
            - github.com/samber/do
            - github.com/samber/go-type-to-string
            - github.com/larsartmann/go-output
            - github.com/LarsArtmann/gogenfilter
            - github.com/a-h/templ
            - github.com/bmatcuk/doublestar
            - github.com/clipperhouse
            - github.com/lucasb-eyer/go-colorful
            - github.com/mattn/go-runewidth
            - github.com/muesli
            - github.com/pelletier/go-toml
            - github.com/rivo/uniseg
            - github.com/segmentio/asm
            - github.com/xo/terminfo
            - go.uber.org/multierr
            - github.com/inconshreveable/mousetrap
            - git.coopcloud.tech/decentral1se/iroh-go
            - golang.org/x/mod
            - golang.org/x/term
            - golang.org/x/text
            - golang.org/x/sys
    exhaustruct:
      exclude:
        - os/exec.Cmd
    funlen:
      lines: 200
      statements: 100
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocognit:
      min-complexity: 35
    gocritic:
      disabled-checks:
        - ifElseChain
    gomoddirectives:
      replace-local: true
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
    makezero:
      always: false
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
        - disabled: false
          name: unused-parameter
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      check-receiver: false
      check-return: false
      ignore-names:
        - g
        - id
        - r
        - t
        - w
        - tb
        - tt
        - ip
        - i
        - ok
        - wg
        - err
        - d
        - p
        - m
        - v
        - e
        - s
        - o
        - c
        - k
        - b
        - f
        - "n"
        - ctx
        - tc
        - op
        - md
        - ch
        - l
        - lc
        - h
        - q
        - uc
        - fn
        - tx
        - mw
        - ts
        - mu
        - rs
        - j
        - db
  exclusions:
    generated: lax
    rules:
      - path: _test\.go$
        linters:
          - err113
          - exhaustruct
          - makezero
          - paralleltest
          - thelper
          - wrapcheck
          - tagalign
          - gosec
          - goconst
          - wsl_v5
          - intrange
          - modernize
          - dupl
          - dupword
          - revive
          - unparam
          - fatcontext
          - errcheck
          - nilnil
          - varnamelen
          - ginkgolinter
          - gocritic
          - errname
          - predeclared
          - noctx
          - forcetypeassert
          - tagliatelle
      - path: internal/cattest/
        linters:
          - thelper
          - exhaustruct
          - gosec
          - err113
          - goconst
      - path: upcaster\.go$
        linters:
          - unparam
      - path: schema.*\.go$
        linters:
          - exhaustruct
      - path: integration/
        linters:
          - staticcheck
          - gocognit
      - path: example/
        linters:
          - forbidigo
          - exhaustruct
          - wrapcheck
      # Tombstone APIs (event.MarkTombstone, event.TombstoneStatus, etc.) are
      # deprecated in favor of domain events (ADR-0114). Migration is in progress
      # across storage/, listing/, watermill/, stack/sqlite/ — exclude SA1019
      # for these modules until the migration is complete.
      - path: (storage|listing|watermill|stack/sqlite)/.*\.go$
        linters:
          - staticcheck
        text: "SA1019: (event\\.MarkTombstone|event\\.TombstoneStatus|event\\.TombstoneMark|event\\.DetectTombstone|event\\.MarkRebirth|event\\.MetadataKeyTombstone|event\\.MetadataKeyRebirth) is deprecated"
      - path: metaengine/irohengine/(quic/)?demo/
        linters:
          - forbidigo
          - errcheck
          - gocritic
          - revive
          - unused
      - path: metaengine/irohengine/demo/
        linters:
          - forbidigo
          - errcheck
      - path: system/
        linters:
          - exhaustruct
          - wrapcheck
          - ireturn
          - gosec
          - gochecknoglobals
          - gochecknoinits
          - gocognit
          - godoclint
          - musttag
          - nestif
          - nlreturn
          - nonamedreturns
          - revive
          - staticcheck
          - tagliatelle
          - varnamelen
          - forcetypeassert
          - gocyclo
          - cyclop
          - maintidx
      - path: metaengine/irohengine/
        linters:
          - exhaustruct
          - wrapcheck
          - prealloc
          - gochecknoglobals
          - predeclared
          - gocritic
      - path: testhelpers/fake.*\.go$
        linters:
          - exhaustruct
      - path: projection/
        linters:
          - exhaustruct
          - tagliatelle
          - nlreturn
      - path: projection/runner\.go$
        linters:
          - wrapcheck
          - err113
      - path: catalog/eventcatalog/
        linters:
          - dupl
          - exhaustruct
          - gocognit
          - nonamedreturns
          - varnamelen
          - wsl_v5
      - path: catalog/(d2|asyncapi|openapi|docserver|httptyped|huma|cmd)/
        linters:
          - exhaustruct
          - nlreturn
          - nolintlint
          - wrapcheck
      - path: catalog/(message_config|registry_build)\.go$
        linters:
          - exhaustruct
      - path: catalog/registry.go$
        linters:
          - exhaustruct
      - path: catalog/registry_copy.go$
        linters:
          - varnamelen
      - path: catalog/registry_helpers.go$
        linters:
          - varnamelen
      - path: testhelpers/
        linters:
          - nlreturn
      - path: catalog/.*_test.go$
        linters:
          - usestdlibvars
          - nolintlint
          - varnamelen
      - path: encryption/.*_test.go$
        linters:
          - contextcheck
          - varnamelen
      - path: encryption/store.go$
        linters:
          - wrapcheck
      - path: storage/
        linters:
          - dupl
          - exhaustruct
          - gosec
          - mnd
          - nestif
          - nilnil
          - tagliatelle
          - varnamelen
          - wrapcheck
          - nlreturn
          - wsl_v5
          - contextcheck
          - ireturn
          # sqlpkg.CloseRows is the project-wide rows.Close helper; sqlclosecheck cannot see through it.
          - sqlclosecheck
      - path: encryption/(aesgcm|xchacha20|envelope)\.go$
        linters:
          - nlreturn
          - dupword
          - forcetypeassert
          - wsl_v5
      - path: codec/cbor.*\.go$
        linters:
          - gochecknoglobals
      - path: kv/viewstoretest/
        linters:
          - gocognit
          - errcheck
      - path: stack/materialize\.go$
        linters:
          - wrapcheck
          - nestif
      - path: stack/contracttest/
        linters:
          - errcheck
          - goconst
          - varnamelen
      - path: benchkit/
        linters:
          - errcheck
          - exhaustruct
          - gochecknoglobals
          - goconst
          - gosec
          - ireturn
          - mnd
          - nonamedreturns
          - tagliatelle
          - wrapcheck
      - path: cmd/cqrs-bench/
        linters:
          - errcheck
          - exhaustruct
          - forbidigo
          - goconst
          - gosec
          - ireturn
          - mnd
          - noctx
          - wrapcheck
          - goconst
          - varnamelen
          - err113
      - path: stack/accessors\.go$
        linters:
          - err113
          - exhaustruct
          - wrapcheck
      - path: stack/(turso|pebble)/preset\.go$
        linters:
          - exhaustruct
          - err113
          - contextcheck
          - wrapcheck
      - path: transport/http/sse
        linters:
          - exhaustruct
          - wrapcheck
      - path: transport/http/sse_event\.go$
        linters:
          - err113
      - path: turso/indexing/
        linters:
          - exhaustruct
          - goconst
          - exhaustive
          - errcheck
          - errorlint
          - nlreturn
          - wsl_v5
          - modernize
          - perfsprint
          - predeclared
          - nolintlint
          - wrapcheck
          - varnamelen
      - path: turso/indexing\.go$
        linters:
          - wsl_v5
      - path: turso/.*_test\.go$
        linters:
          - rowserrcheck
          - sqlclosecheck
          - unqueryvet
          - staticcheck
          - varnamelen
      - path: saga/
        linters:
          - nlreturn
          - exhaustruct
          - err113
          - mnd
          - dupl
          - wrapcheck
          - wsl_v5
          - embeddedstructfieldcheck
      - path: cmd/cqrs-gen/
        linters:
          - dupl
          - exhaustruct
          - err113
          - funlen
          - gocognit
          - mnd
          - nlreturn
          - varnamelen
          - wrapcheck
          - wsl_v5
          - dupword
          - forbidigo
          - gosec
      - path: cmd/cqrs-lint/
        linters:
          - exhaustruct
          - funlen
          - gocognit
          - goconst
          - godoclint
          - gosec
          - mnd
          - nestif
          - nonamedreturns
          - varnamelen
          - wrapcheck
          - forbidigo
          - wsl_v5
          - nlreturn
          - gocyclo
          - cyclop
          - maintidx
      - path: watermill/
        linters:
          - wsl_v5
          - wrapcheck
          - err113
          - nestif
          - mnd
          - exhaustruct
          - dupl
          - errcheck
          - perfsprint
          - nolintlint
      - path: testhelpers/
        linters:
          - nlreturn
      - path: kv/
        linters:
          - ireturn
      - path: otel/
        linters:
          - ireturn
      - path: stack/
        linters:
          - ireturn
      - path: watermill/
        linters:
          - ireturn
      - path: encryption/
        linters:
          - ireturn
      - path: command/
        linters:
          - wrapcheck
      - path: query/
        linters:
          - wrapcheck
      - path: decider/
        linters:
          - ireturn
      - path: schema/
        linters:
          - ireturn
      - path: snapshot/
        linters:
          - ireturn
      - path: codec/
        linters:
          - ireturn
      - path: graph/
        linters:
          - ireturn
      - path: projection/
        linters:
          - ireturn
      - path: projectionhost/
        linters:
          - ireturn
      - path: catalog/
        linters:
          - ireturn
      - path: middleware/
        linters:
          - ireturn
      - path: transport/
        linters:
          - ireturn
      - path: signing/
        linters:
          - ireturn
      - path: sync/
        linters:
          - modernize
      - path: metaengine/
        linters:
          - cyclop
          - exhaustruct
          - forcetypeassert
          - gocognit
          - ireturn
          - mnd
          - gosec
          - goconst
          - exhaustive
          - varnamelen
          - wsl_v5
          - nonamedreturns
          - nlreturn
          - tagliatelle
          - funlen
          - nestif
      - path: metaengine/duckdbengine/
        linters:
          - wrapcheck
          - varnamelen
          - wsl_v5
      - path: metaengine/pgengine/
        linters:
          - wrapcheck
          - varnamelen
          - wsl_v5
      - path: metaengine/pebbleengine/
        linters:
          - wrapcheck
          - makezero
          - modernize
          - prealloc
          - varnamelen
          - gosec
      - path: cmd/doc-check/
        linters:
          - gosec
      - path: _test\.go
        linters:
          - exhaustruct
          - testpackage
          - gochecknoglobals
          - funlen
          - cyclop
          - goconst
      - path: _test\.go
        text: unused
        linters:
          - unused
    paths:
      - \.gen\.go$
      - \.pb\.go$
      - _templ\.go$
      - event/
      - event/eventtest/
      - event/v4/eventtest/
      - storage/view/
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(github.com/larsartmann/go-cqrs-lite)
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - \.pb\.go$
      - _templ\.go$
      - event/
      - event/eventtest/
      - event/v4/eventtest/
      - storage/view/
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
