version: "2"
run:
    timeout: 5m
    go: 1.26.7
    build-tags:
        - goexperiment.arenas
        - goexperiment.goroutineleakprofile
        - goexperiment.jsonv2
        - goexperiment.runtimesecret
        - goexperiment.simd
    allow-parallel-runners: true
    allow-serial-runners: true
    issues-exit-code: 1
    tests: true
output:
    formats: {}
linters:
    enable:
        - arangolint
        - asasalint
        - asciicheck
        - bidichk
        - bodyclose
        - canonicalheader
        - clickhouselint
        - containedctx
        - contextcheck
        - copyloopvar
        - cyclop
        - decorder
        - dogsled
        - dupl
        - dupword
        - durationcheck
        - embeddedstructfieldcheck
        - err113
        - errcheck
        - errchkjson
        - errname
        - errorlint
        - exhaustive
        - exhaustruct
        - exptostd
        - fatcontext
        - forbidigo
        - forcetypeassert
        - funlen
        - ginkgolinter
        - gocheckcompilerdirectives
        - gochecknoglobals
        - gochecknoinits
        - gochecksumtype
        - gocognit
        - goconst
        - gocritic
        - gocyclo
        - godoclint
        - godot
        - godox
        - goheader
        - gomoddirectives
        - gomodguard_v2
        - goprintffuncname
        - gosec
        - gosmopolitan
        - govet
        - grouper
        - iface
        - importas
        - inamedparam
        - ineffassign
        - interfacebloat
        - intrange
        - iotamixing
        - ireturn
        - loggercheck
        - maintidx
        - makezero
        - mirror
        - misspell
        - mnd
        - modernize
        - musttag
        - nakedret
        - nestif
        - nilerr
        - nilnesserr
        - nilnil
        - nlreturn
        - noctx
        - nolintlint
        - nonamedreturns
        - nosprintfhostport
        - paralleltest
        - perfsprint
        - prealloc
        - predeclared
        - promlinter
        - protogetter
        - reassign
        - recvcheck
        - revive
        - rowserrcheck
        - sloglint
        - spancheck
        - sqlclosecheck
        - staticcheck
        - tagalign
        - tagliatelle
        - testableexamples
        - testifylint
        - testpackage
        - thelper
        - tparallel
        - unconvert
        - unparam
        - unqueryvet
        - unused
        - usestdlibvars
        - usetesting
        - varnamelen
        - wastedassign
        - whitespace
        - wrapcheck
        - wsl_v5
        - zerologlint
    disable:
        - depguard
    default: none
    settings:
        cyclop:
            max-complexity: 25
        errcheck:
            exclude-functions:
                - (*os.File).Close
                - (io.Closer).Close
                - (*sql.DB).Close
                - (*sql.Rows).Close
                - (*sql.Stmt).Close
                - (net.Conn).Close
                - (*net.TCPConn).Close
                - (*net.UDPConn).Close
                - fmt.Fprint
                - fmt.Fprintf
                - fmt.Fprintln
                - fmt.Print
                - fmt.Printf
                - fmt.Println
                - (*strings.Builder).WriteString
                - (*bytes.Buffer).WriteString
        exhaustruct:
            exclude:
                - os/exec.Cmd
                - go.etcd.io/bbolt.Options
                - github.com/larsartmann/go-cqrs-lite/stack/v4.Capabilities
        funlen:
            lines: 200
            statements: 100
        ginkgolinter:
            forbid-focus-container: true
            forbid-spec-pollution: true
        gocognit:
            min-complexity: 35
        gocritic:
            disabled-checks:
                - ifElseChain
        gomoddirectives:
            replace-local: true
        gosec:
            excludes:
                - G304
                - G115
        ireturn:
            allow:
                - error
                - empty
                - anon
                - stdlib
                - generic
        makezero:
            always: false
        mnd:
            ignored-numbers:
                - "0"
                - "1"
                - "2"
                - "100"
        revive:
            rules:
                - disabled: true
                  name: exported
                - disabled: true
                  name: package-comments
                - disabled: false
                  name: unused-parameter
        testifylint:
            disable:
                - go-require
            enable-all: true
        varnamelen:
            check-receiver: false
            check-return: false
            ignore-names:
                - g
                - id
                - r
                - t
                - w
                - tb
                - tt
                - ip
                - i
                - ok
                - wg
                - err
                - d
                - p
                - m
                - v
                - e
                - s
                - o
                - c
                - k
                - b
                - f
                - "n"
                - ctx
                - tc
                - op
                - md
                - ch
                - l
                - lc
                - h
                - q
                - uc
                - fn
                - tx
                - mw
                - ts
                - mu
                - rs
                - j
                - db
        wrapcheck:
            ignore-sigs:
                - .Errorf(
                - errors.New(
                - errors.Unwrap(
                - errors.Join(
                - .Wrap(
                - .Wrapf(
                - .WithMessage(
                - .WithMessagef(
                - .WithStack(
    exclusions:
        generated: lax
        rules:
            - path: _test\.go$
              linters:
                - err113
                - exhaustruct
                - makezero
                - paralleltest
                - thelper
                - wrapcheck
                - tagalign
                - gosec
                - goconst
                - wsl_v5
                - intrange
                - modernize
                - dupl
                - dupword
                - revive
                - unparam
                - fatcontext
                - errcheck
                - nilnil
                - varnamelen
                - ginkgolinter
                - gocritic
                - errname
                - predeclared
                - noctx
                - forcetypeassert
                - tagliatelle
            - path: _test\.go
              linters:
                - exhaustruct
                - testpackage
                - gochecknoglobals
                - funlen
                - cyclop
                - goconst
            - path: _test\.go
              text: unused
              linters:
                - unused
            - path: (kv|otel|stack|decider|schema|snapshot|graph|projectionhost|catalog|middleware|transport)/
              linters:
                - ireturn
            - path: internal/cattest/
              linters:
                - thelper
                - exhaustruct
                - gosec
                - err113
                - goconst
            - path: testhelpers/fake.*\.go$
              linters:
                - exhaustruct
            - path: testhelpers/
              linters:
                - nlreturn
            - path: upcaster\.go$
              linters:
                - unparam
            - path: schema.*\.go$
              linters:
                - exhaustruct
            - path: integration/
              linters:
                - staticcheck
                - gocognit
            - path: example/
              linters:
                - forbidigo
                - exhaustruct
                - wrapcheck
            - path: (storage|listing|watermill|stack/sqlite)/.*\.go$
              text: 'SA1019: (event\.MarkTombstone|event\.TombstoneStatus|event\.TombstoneMark|event\.DetectTombstone|event\.MarkRebirth|event\.MetadataKeyTombstone|event\.MetadataKeyRebirth) is deprecated'
              linters:
                - staticcheck
            - path: (stack|storage|graph|benchkit|cmd/cqrs-bench|example|integration|record|metadata|event|command|query|metaengine|commandlifecycle|decider)/.*\.go$
              text: 'SA1019: .*removed in v5.*'
              linters:
                - staticcheck
            - path: (event|metadata)/.*_test\.go$
              text: 'SA1019: .*EnsureCustom.*is deprecated'
              linters:
                - staticcheck
            - path: (middleware|idempotency)/.*_test\.go$
              text: 'SA1019: .*(NewMemoryStore|MemoryStore) is deprecated'
              linters:
                - staticcheck
            - path: id/
              linters:
                - err113
                - errcheck
                - exhaustive
                - exhaustruct
                - recvcheck
                - wrapcheck
                - nolintlint
            - path: record/
              linters:
                - modernize
                - recvcheck
            - path: metaengine/(.*/)?register\.go$
              linters:
                - gochecknoinits
            - path: metaengine/mysqlengine/
              linters:
                - sqlclosecheck
                - wrapcheck
                - varnamelen
            - path: system/
              linters:
                - exhaustruct
                - wrapcheck
                - ireturn
                - gosec
                - gochecknoglobals
                - gochecknoinits
                - gocognit
                - godoclint
                - musttag
                - nestif
                - nlreturn
                - nonamedreturns
                - revive
                - tagliatelle
                - varnamelen
                - forcetypeassert
                - gocyclo
                - cyclop
                - maintidx
            - path: metaengine/
              linters:
                - cyclop
                - gocyclo
                - exhaustruct
                - forcetypeassert
                - gocognit
                - ireturn
                - mnd
                - gosec
                - goconst
                - exhaustive
                - varnamelen
                - wsl_v5
                - nonamedreturns
                - nlreturn
                - tagliatelle
                - funlen
                - nestif
                - err113
                - gochecknoglobals
                - wrapcheck
                - nolintlint
                - containedctx
                - modernize
            - path: metaengine/irohengine/
              linters:
                - exhaustruct
                - wrapcheck
                - prealloc
                - gochecknoglobals
                - predeclared
                - gocritic
            - path: metaengine/irohengine/(quic/)?demo/
              linters:
                - forbidigo
                - errcheck
                - gocritic
                - revive
                - unused
            - path: metaengine/irohengine/demo/
              linters:
                - forbidigo
                - errcheck
            - path: metaengine/duckdbengine/
              linters:
                - wrapcheck
                - varnamelen
                - wsl_v5
                - sqlclosecheck
                - prealloc
            - path: metaengine/pgengine/
              linters:
                - wrapcheck
                - varnamelen
                - sqlclosecheck
                - wsl_v5
            - path: metaengine/pebbleengine/
              linters:
                - wrapcheck
                - makezero
                - modernize
                - prealloc
                - varnamelen
                - gosec
                - gochecknoglobals
            - path: storage/
              linters:
                - dupl
                - exhaustruct
                - gosec
                - mnd
                - nestif
                - nilnil
                - tagliatelle
                - varnamelen
                - wrapcheck
                - nlreturn
                - wsl_v5
                - contextcheck
                - ireturn
                - sqlclosecheck
            - path: turso/indexing/
              linters:
                - exhaustruct
                - goconst
                - exhaustive
                - errcheck
                - errorlint
                - nlreturn
                - wsl_v5
                - modernize
                - perfsprint
                - predeclared
                - nolintlint
                - wrapcheck
                - varnamelen
            - path: turso/indexing\.go$
              linters:
                - wsl_v5
            - path: turso/.*_test\.go$
              linters:
                - rowserrcheck
                - sqlclosecheck
                - unqueryvet
                - staticcheck
                - varnamelen
            - path: command/commandtest/
              linters:
                - mnd
            - path: query/querytest/
              linters:
                - mnd
            - path: catalog/eventcatalog/
              linters:
                - dupl
                - exhaustruct
                - gocognit
                - nonamedreturns
                - varnamelen
                - wsl_v5
            - path: catalog/(d2|asyncapi|openapi|docserver|httptyped|huma|cmd)/
              linters:
                - exhaustruct
                - nlreturn
                - nolintlint
                - wrapcheck
                - staticcheck
            - path: catalog/(message_config|registry_build)\.go$
              linters:
                - exhaustruct
            - path: catalog/registry.go$
              linters:
                - exhaustruct
            - path: catalog/registry_copy.go$
              linters:
                - varnamelen
            - path: catalog/registry_helpers.go$
              linters:
                - varnamelen
            - path: catalog/.*_test.go$
              linters:
                - usestdlibvars
                - nolintlint
                - varnamelen
            - path: projection/
              linters:
                - exhaustruct
                - tagliatelle
                - nlreturn
                - ireturn
            - path: projection/runner\.go$
              linters:
                - wrapcheck
                - err113
            - path: encryption/
              linters:
                - ireturn
                - wrapcheck
                - nolintlint
            - path: encryption/.*_test.go$
              linters:
                - contextcheck
                - varnamelen
            - path: encryption/store.go$
              linters:
                - wrapcheck
            - path: encryption/(aesgcm|xchacha20|envelope)\.go$
              linters:
                - nlreturn
                - dupword
                - forcetypeassert
                - wsl_v5
            - path: signing/
              linters:
                - ireturn
                - wrapcheck
                - nolintlint
            - path: watermill/
              linters:
                - wsl_v5
                - wrapcheck
                - err113
                - nestif
                - mnd
                - exhaustruct
                - dupl
                - errcheck
                - perfsprint
                - nolintlint
                - ireturn
                - varnamelen
            - path: transport/http/sse
              linters:
                - exhaustruct
                - wrapcheck
            - path: transport/http/sse_event\.go$
              linters:
                - err113
            - path: stack/materialize\.go$
              linters:
                - wrapcheck
                - nestif
            - path: stack/contracttest/
              linters:
                - errcheck
                - goconst
                - varnamelen
            - path: stack/accessors\.go$
              linters:
                - err113
                - exhaustruct
                - wrapcheck
            - path: stack/(turso|pebble)/preset\.go$
              linters:
                - exhaustruct
                - err113
                - contextcheck
                - wrapcheck
            - path: stack/bench/
              linters:
                - containedctx
                - gocognit
                - nilerr
                - unconvert
            - path: benchkit/
              linters:
                - errcheck
                - exhaustruct
                - gochecknoglobals
                - goconst
                - gosec
                - ireturn
                - mnd
                - nonamedreturns
                - tagliatelle
                - wrapcheck
            - path: cmd/cqrs-gen/
              linters:
                - dupl
                - exhaustruct
                - err113
                - funlen
                - gocognit
                - mnd
                - nlreturn
                - varnamelen
                - wrapcheck
                - wsl_v5
                - dupword
                - forbidigo
                - gosec
            - path: cmd/cqrs-lint/
              linters:
                - exhaustruct
                - funlen
                - gocognit
                - goconst
                - godoclint
                - gosec
                - mnd
                - nestif
                - nonamedreturns
                - varnamelen
                - wrapcheck
                - forbidigo
                - wsl_v5
                - nlreturn
                - gocyclo
                - cyclop
                - maintidx
            - path: cmd/cqrs-bench/
              linters:
                - errcheck
                - exhaustruct
                - forbidigo
                - goconst
                - gosec
                - ireturn
                - mnd
                - noctx
                - wrapcheck
                - varnamelen
                - err113
                - nolintlint
                - contextcheck
            - path: cmd/doc-check/
              linters:
                - gosec
                - err113
            - path: cmd/api-stability/
              linters:
                - gocognit
            - path: system/
              linters:
                - err113
                - goconst
                - prealloc
                - perfsprint
                - funlen
                - golines
                - wsl_v5
            - path: saga/
              linters:
                - nlreturn
                - exhaustruct
                - err113
                - mnd
                - dupl
                - wrapcheck
                - wsl_v5
                - embeddedstructfieldcheck
            - path: kv/viewstoretest/
              linters:
                - gocognit
                - errcheck
            - path: command/
              linters:
                - wrapcheck
                - exhaustruct
                - nolintlint
            - path: query/
              linters:
                - wrapcheck
                - exhaustruct
                - nolintlint
            - path: sync/
              linters:
                - modernize
            - path: catalog/docserver/
              linters:
                - contextcheck
                - godoclint
        paths:
            - \.gen\.go$
            - \.pb\.go$
            - _templ\.go$
            - event/
            - event/eventtest/
            - event/v4/eventtest/
            - metaengine/sqliteengine/
            - storage/view/
            - vendor/
formatters:
    enable:
        - gci
        - goimports
        - gofumpt
        - golines
    settings:
        golines:
            max-len: 120
    exclusions:
        generated: lax
        paths:
            - \.pb\.go$
            - _templ\.go$
            - event/
            - event/eventtest/
            - event/v4/eventtest/
            - metaengine/sqliteengine/
            - storage/view/
issues:
    max-issues-per-linter: 50
    max-same-issues: 10
