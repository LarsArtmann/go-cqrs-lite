version: "2"
run:
  timeout: 5m
  go: "1.27"
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  default: none
  settings:
    cyclop:
      max-complexity: 25
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (net.Conn).Close
        - (*net.TCPConn).Close
        - (*net.UDPConn).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - (*strings.Builder).WriteString
        - (*bytes.Buffer).WriteString
    exhaustruct_v5:
      ignore-patterns:
        - os/exec.Cmd
        - go.etcd.io/bbolt.Options
        - github.com/larsartmann/go-cqrs-lite/stack/v4.Capabilities
        - github.com/larsartmann/go-cqrs-lite/queue/v4/task.New
        - github.com/larsartmann/go-cqrs-lite/queue/v4/task.Task
        - github.com/larsartmann/go-cqrs-lite/queue/v4.Filter
        - github.com/larsartmann/go-cqrs-lite/queue/v4/facts.Fact
        - github.com/larsartmann/go-cqrs-lite/metaengine/v4\.EngineProfile
        - github.com/larsartmann/go-cqrs-lite/storage/v4/pebble\.storeBase
        - github.com/larsartmann/go-cqrs-lite/storage/v4/bbolt\.storeBase
    funlen:
      lines: 200
      statements: 100
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocognit:
      min-complexity: 35
    goconst:
      ignore-tests: true
      min-len: 4
      min-occurrences: 5
    gocritic:
      disabled-checks:
        - ifElseChain
    gocyclo:
      min-complexity: 20
    gomoddirectives:
      replace-local: true
    gosec:
      excludes:
        - G304
        - G115
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
    makezero:
      always: false
    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "100"
    nestif:
      min-complexity: 6
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
        - disabled: false
          name: unused-parameter
    tagalign:
      align: false
      order:
        - binding
        - json
        - yaml
        - xml
        - toml
        - validate
        - mapstructure
      sort: true
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      check-receiver: false
      check-return: false
      ignore-names:
        - g
        - id/v4
        - r
        - t
        - w
        - tb
        - tt
        - ip
        - i
        - ok
        - wg
        - err
        - d
        - p
        - m
        - v
        - e
        - s
        - o
        - c
        - k
        - b
        - f
        - "n"
        - ctx
        - tc
        - op
        - md
        - ch
        - l
        - lc
        - h
        - q
        - uc
        - fn
        - tx
        - mw
        - ts
        - mu
        - rs
        - j
        - db
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - .NewRejection(
        - .NewTransient(
        - .NewInfrastructure(
        - .NewCorruption(
        - .NewConflict(
        - .NewOrchestration(
        - .Newf(
        - .WrapRejection(
        - .WrapTransient(
        - .WrapInfrastructure(
        - .WrapCorruption(
        - .WrapConflict(
        - .WrapOrchestration(
        - .WithCause(
        - .Scan(
        - (*database/sql.Rows).Err
        - (*database/sql.DB).Query
        - (*database/sql.DB).Exec
        - (*database/sql.DB).Close
        - (*database/sql.DB).BeginTx
        - (*database/sql.Tx).Query
        - (*database/sql.Tx).Exec
        - (*database/sql.Tx).Commit
        - Result).RowsAffected(
        - (*github.com/jackc/pgx/v5/pgxpool.Pool).Query
        - (*github.com/jackc/pgx/v5/pgxpool.Pool).Exec
        - (*github.com/jackc/pgx/v5/pgxpool.Pool).Begin
        - (github.com/jackc/pgx/v5.Tx).Query
        - (github.com/jackc/pgx/v5.Tx).Exec
        - (github.com/jackc/pgx/v5.Tx).Commit
        - (github.com/jackc/pgx/v5.Rows).Err
  exclusions:
    generated: lax
    rules:
      - path: _test\.go$
        linters:
          - err113
          - exhaustruct_v5
          - makezero
          - paralleltest
          - thelper
          - wrapcheck
          - tagalign
          - gosec
          - goconst
          - wsl_v5
          - intrange
          - modernize
          - dupl
          - dupword
          - revive
          - unparam
          - fatcontext
          - errcheck
          - nilnil
          - varnamelen
          - ginkgolinter
          - gocritic
          - errname
          - predeclared
          - noctx
          - forcetypeassert
          - tagliatelle
      - path: _test\.go
        linters:
          - exhaustruct_v5
          - testpackage
          - gochecknoglobals
          - funlen
          - cyclop
          - goconst
          - forcetypeassert
          - gosec
          - errcheck
          - wrapcheck
          - ireturn
          - recvcheck
          - contextcheck
          - exhaustive
      - path: _test\.go
        text: unused
        linters:
          - unused
      - path: (kv/v4|otel/v4|stack/v4|decider/v4|schema/v4|snapshot/v4|graph/v4|projectionhost/v4|catalog/v4|middleware/v4|transport)/
        linters:
          - ireturn
      - path: internal/cattest/
        linters:
          - thelper
          - exhaustruct_v5
          - gosec
          - err113
          - goconst
      - path: queue/v4/conformance/
        linters:
          - mnd
      - text: 'embedlit: embedded field type can be removed from struct literal'
        linters:
          - modernize
      - path: testhelpers/fake.*\.go$
        linters:
          - exhaustruct_v5
      - path: testhelpers/
        linters:
          - nlreturn
      - path: upcaster\.go$
        linters:
          - unparam
      - path: schema.*\.go$
        linters:
          - exhaustruct_v5
      - path: integration/v4/
        linters:
          - staticcheck
          - gocognit
      - path: example/
        linters:
          - forbidigo
          - exhaustruct_v5
          - wrapcheck
      - path: (storage/v4|listing/v4|watermill/v4|stack/sqlite/v4)/.*\.go$
        text: 'SA1019: .*event/v4\.(MarkTombstone|TombstoneStatus|TombstoneMark|DetectTombstone|MarkRebirth|MetadataKeyTombstone|MetadataKeyRebirth) is deprecated'
        linters:
          - staticcheck
      - path: benchkit/v4/phases_projection\.go$
        text: Function `Stop` should pass the context parameter
        linters:
          - contextcheck
      - path: (stack/v4|storage/v4|graph/v4|benchkit/v4|cmd/cqrs-bench/v4|example|integration/v4|record/v4|metadata/v4|event/v4|command/v4|query/v4|metaengine/v4|commandlifecycle/v4|decider/v4)/.*\.go$
        text: 'SA1019: .*removed in v5.*'
        linters:
          - staticcheck
      - path: (event/v4|metadata/v4)/.*_test\.go$
        text: 'SA1019: .*EnsureCustom.*is deprecated'
        linters:
          - staticcheck
      - path: (middleware/v4|idempotency)/.*_test\.go$
        text: 'SA1019: .*(NewMemoryStore|MemoryStore) is deprecated'
        linters:
          - staticcheck
      - path: idempotency/.*_test\.go$
        text: 'SA1019: .*metaengine\.DedupStore.*'
        linters:
          - staticcheck
      - path: id/v4/
        linters:
          - err113
          - errcheck
          - exhaustive
          - exhaustruct_v5
          - recvcheck
          - wrapcheck
          - nolintlint
      - path: record/v4/
        linters:
          - modernize
          - recvcheck
      - path: (metaengine/v4|queue/v4)/(.*/)?register\.go$
        linters:
          - gochecknoinits
      - path: cmd/cqrs-lint/v4/pkg/rules/.*/template\.go$
        linters:
          - gochecknoglobals
      - path: cmd/cqrs-lint/v4/pkg/toolspec/toolspec\.go$
        linters:
          - gochecknoinits
      - path: metaengine/mysqlengine/v4/
        linters:
          - sqlclosecheck
          - wrapcheck
          - varnamelen
      - path: system/v4/
        linters:
          - exhaustruct_v5
          - wrapcheck
          - ireturn
          - gosec
          - gochecknoglobals
          - gochecknoinits
          - gocognit
          - godoclint
          - musttag
          - nestif
          - nlreturn
          - nonamedreturns
          - revive
          - tagliatelle
          - varnamelen
          - forcetypeassert
          - gocyclo
          - cyclop
          - maintidx
      - path: systemscenario/v4/
        linters:
          - containedctx
          - contextcheck
          - exhaustruct_v5
          - ireturn
      - path: systemscenario/v4/chaos\.go$
        linters:
          - wrapcheck
      - path: metaengine/v4/
        linters:
          - cyclop
          - gocyclo
          - maintidx
          - exhaustruct_v5
          - forcetypeassert
          - gocognit
          - ireturn
          - mnd
          - gosec
          - goconst
          - exhaustive
          - varnamelen
          - wsl_v5
          - nonamedreturns
          - nlreturn
          - tagliatelle
          - funlen
          - nestif
          - err113
          - gochecknoglobals
          - wrapcheck
          - nolintlint
          - containedctx
          - modernize
      - path: metaengine/irohengine/v4/
        linters:
          - exhaustruct_v5
          - wrapcheck
          - prealloc
          - gochecknoglobals
          - predeclared
          - gocritic
      - path: metaengine/irohengine/v4/(quic/)?demo/
        linters:
          - forbidigo
          - errcheck
          - gocritic
          - revive
          - unused
      - path: metaengine/irohengine/v4/demo/
        linters:
          - forbidigo
          - errcheck
      - path: metaengine/duckdbengine/v4/
        linters:
          - wrapcheck
          - varnamelen
          - wsl_v5
          - sqlclosecheck
          - prealloc
      - path: metaengine/pgengine/v4/
        linters:
          - wrapcheck
          - varnamelen
          - sqlclosecheck
          - wsl_v5
      - path: metaengine/pebbleengine/v4/
        linters:
          - wrapcheck
          - makezero
          - modernize
          - prealloc
          - varnamelen
          - gosec
          - gochecknoglobals
      - path: storage/v4/
        linters:
          - dupl
          - exhaustruct_v5
          - gosec
          - mnd
          - nestif
          - nilnil
          - tagliatelle
          - varnamelen
          - wrapcheck
          - nlreturn
          - wsl_v5
          - contextcheck
          - ireturn
          - sqlclosecheck
      - path: turso/indexing/
        linters:
          - exhaustruct_v5
          - goconst
          - exhaustive
          - errcheck
          - errorlint
          - nlreturn
          - wsl_v5
          - modernize
          - perfsprint
          - predeclared
          - nolintlint
          - wrapcheck
          - varnamelen
      - path: turso/indexing\.go$
        linters:
          - wsl_v5
      - path: turso/.*_test\.go$
        linters:
          - rowserrcheck
          - sqlclosecheck
          - unqueryvet
          - staticcheck
          - varnamelen
      - path: command/v4/commandtest/
        linters:
          - mnd
      - path: query/v4/querytest/
        linters:
          - mnd
      - path: catalog/v4/eventcatalog/
        linters:
          - dupl
          - exhaustruct_v5
          - gocognit
          - nonamedreturns
          - varnamelen
          - wsl_v5
      - path: catalog/v4/(d2|asyncapi|openapi|docserver|httptyped|huma|cmd)/
        linters:
          - exhaustruct_v5
          - nlreturn
          - nolintlint
          - wrapcheck
          - staticcheck
      - path: catalog/v4/compat/
        linters:
          - exhaustruct_v5
      - path: catalog/v4/(message_config|message_config_rest|registry_build)\.go$
        linters:
          - exhaustruct_v5
      - path: catalog/v4/registry.go$
        linters:
          - exhaustruct_v5
      - path: catalog/v4/registry_copy.go$
        linters:
          - varnamelen
      - path: catalog/v4/registry_helpers.go$
        linters:
          - varnamelen
      - path: catalog/v4/.*_test.go$
        linters:
          - usestdlibvars
          - nolintlint
          - varnamelen
      - path: projection/v4/
        linters:
          - exhaustruct_v5
          - tagliatelle
          - nlreturn
          - ireturn
      - path: projection/v4/runner\.go$
        linters:
          - wrapcheck
          - err113
      - path: encryption/v4/
        linters:
          - ireturn
          - wrapcheck
          - nolintlint
      - path: encryption/v4/.*_test.go$
        linters:
          - contextcheck
          - varnamelen
      - path: encryption/v4/store.go$
        linters:
          - wrapcheck
      - path: encryption/v4/(aesgcm|xchacha20|envelope)\.go$
        linters:
          - nlreturn
          - dupword
          - forcetypeassert
          - wsl_v5
      - path: signing/v4/
        linters:
          - ireturn
          - wrapcheck
          - nolintlint
      - path: watermill/v4/
        linters:
          - wsl_v5
          - wrapcheck
          - err113
          - nestif
          - mnd
          - exhaustruct_v5
          - dupl
          - errcheck
          - perfsprint
          - nolintlint
          - ireturn
          - varnamelen
      - path: transport/http/sse
        linters:
          - exhaustruct_v5
          - wrapcheck
      - path: transport/http/sse_event\.go$
        linters:
          - err113
      - path: stack/v4/materialize\.go$
        linters:
          - wrapcheck
          - nestif
      - path: stack/v4/contracttest/
        linters:
          - errcheck
          - goconst
          - varnamelen
      - path: stack/v4/accessors\.go$
        linters:
          - err113
          - exhaustruct_v5
          - wrapcheck
      - path: stack/v4/(turso|pebble)/preset\.go$
        linters:
          - exhaustruct_v5
          - err113
          - contextcheck
          - wrapcheck
      - path: stack/bench/v4/
        linters:
          - containedctx
          - gocognit
          - nilerr
          - unconvert
      - path: benchkit/v4/
        linters:
          - errcheck
          - exhaustruct_v5
          - gochecknoglobals
          - goconst
          - gosec
          - ireturn
          - mnd
          - nonamedreturns
          - tagliatelle
          - wrapcheck
      - path: cmd/cqrs-gen/v4/
        linters:
          - dupl
          - exhaustruct_v5
          - err113
          - funlen
          - gocognit
          - mnd
          - nlreturn
          - varnamelen
          - wrapcheck
          - wsl_v5
          - dupword
          - forbidigo
          - gosec
      - path: cmd/cqrs-lint/v4/
        linters:
          - exhaustruct_v5
          - funlen
          - gocognit
          - goconst
          - godoclint
          - gosec
          - mnd
          - nestif
          - nonamedreturns
          - varnamelen
          - wrapcheck
          - forbidigo
          - wsl_v5
          - nlreturn
          - gocyclo
          - cyclop
          - maintidx
      - path: cmd/cqrs-lint/v4/pkg/rules/catalog_(api|adoption|boilerplate)\.go$
        linters:
          - dupl
      - path: cmd/cqrs-upgrade/v4/
        linters:
          - contextcheck
          - exhaustruct_v5
          - forbidigo
          - gochecknoglobals
          - gosec
          - mnd
          - noctx
          - staticcheck
          - varnamelen
          - wrapcheck
          - wsl_v5
      - path: cmd/cqrs-bench/v4/
        linters:
          - errcheck
          - exhaustruct_v5
          - forbidigo
          - goconst
          - gosec
          - ireturn
          - mnd
          - noctx
          - wrapcheck
          - varnamelen
          - err113
          - nolintlint
          - contextcheck
      - path: cmd/doc-check/v4/
        linters:
          - gosec
          - err113
          - exhaustruct_v5
          - gochecknoglobals
          - goconst
      - path: cmd/api-stability/v4/
        linters:
          - gocognit
      - path: integration/v4/full_flow_test.go
        linters:
          - gocyclo
      - path: stack/sqlite/v4/view_models_integration_test.go
        linters:
          - gocyclo
      - path: scheduling/sqlstore/v4/property_test.go
        linters:
          - gocognit
      - path: system/v4/
        linters:
          - err113
          - goconst
          - prealloc
          - perfsprint
          - funlen
          - golines
          - wsl_v5
      - path: saga/
        linters:
          - nlreturn
          - exhaustruct_v5
          - err113
          - mnd
          - dupl
          - wrapcheck
          - wsl_v5
          - embeddedstructfieldcheck
      - path: kv/v4/viewstoretest/
        linters:
          - gocognit
          - errcheck
      - path: command/v4/
        linters:
          - wrapcheck
          - exhaustruct_v5
          - nolintlint
      - path: query/v4/
        linters:
          - wrapcheck
