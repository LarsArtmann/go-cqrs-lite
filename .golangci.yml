version: "2"
run:
  timeout: 5m
  go: 1.26.4
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  default: none
  settings:
    cyclop:
      max-complexity: 25
    depguard:
      rules:
        Main:
          allow:
            - $gostd
            - github.com/larsartmann/go-cqrs-lite
            - github.com/larsartmann/go-retry
            - github.com/larsartmann/go-idempotency
            - github.com/larsartmann/go-codec
            - github.com/larsartmann/go-composable-business-types
            - github.com/larsartmann/go-branded-id
            - github.com/larsartmann/go-sse
            - github.com/google/uuid
            - github.com/cockroachdb/errors
            - github.com/go-json-experiment/json
            - github.com/go-faster/yaml
            - gopkg.in/yaml
            - github.com/oklog/ulid
            - github.com/DATA-DOG/go-sqlmock
            - github.com/stretchr/testify
            - github.com/onsi/ginkgo
            - github.com/onsi/gomega
            - go.opentelemetry.io/otel
            - github.com/cockroachdb/pebble
            - github.com/larsartmann/go-error-family
            - github.com/larsartmann/go-flightrecorder
            - github.com/larsartmann/go-must
            - modernc.org/sqlite
            - github.com/mattn/go-sqlite3
            - turso.tech/database/tursogo
            - github.com/ThreeDotsLabs/watermill
            # watermill-redisstream is covered by the watermill prefix above;
            # listing it explicitly breaks depguard's prefix resolution.
            - github.com/redis/go-redis/v9
            - github.com/samber/ro
            - github.com/samber/lo
            - github.com/fxamacker/cbor
            - github.com/gkampitakis/go-snaps
            - pgregory.net/rapid
            - github.com/testcontainers/testcontainers-go
            - go/ast
            - go/format
            - go/parser
            - go/token
            - go/types
            - golang.org/x/tools
            - golang.org/x/crypto
            - golang.org/x/sync
            - github.com/prometheus/client_golang
            - github.com/prometheus/client_model
            - github.com/maypok86/otter
            - github.com/failsafe-go/failsafe-go
            - github.com/jackc/pgx
            - github.com/go-sql-driver/mysql
            - github.com/duckdb/duckdb-go
            - github.com/dustin/go-humanize
            - google.golang.org/grpc
            - google.golang.org/protobuf
            - github.com/larsartmann/go-finding
            - github.com/larsartmann/cmdguard
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            - charm.land
            - github.com/charmbracelet
            - github.com/samber/do
            - github.com/samber/go-type-to-string
            - github.com/knadh/koanf
            - github.com/larsartmann/go-output
            - github.com/LarsArtmann/gogenfilter
            - github.com/larsartmann/templ-components
            - github.com/a-h/templ
            - github.com/bmatcuk/doublestar
            - github.com/clipperhouse
            - github.com/lucasb-eyer/go-colorful
            - github.com/mattn/go-runewidth
            - github.com/muesli
            - github.com/pelletier/go-toml
            - github.com/rivo/uniseg
            - github.com/segmentio/asm
            - github.com/xo/terminfo
            - go.uber.org/multierr
            - github.com/inconshreveable/mousetrap
            - git.coopcloud.tech/decentral1se/iroh-go
            - github.com/dgraph-io/dgo/v240
            - github.com/dgraph-io/badger/v4
            - go.etcd.io/bbolt
            - golang.org/x/mod
            - golang.org/x/term
            - golang.org/x/text
            - golang.org/x/sys
    exhaustruct:
      exclude:
        - os/exec.Cmd
        - go.etcd.io/bbolt.Options
        - github.com/larsartmann/go-cqrs-lite/stack/v4.Capabilities
    funlen:
      lines: 200
      statements: 100
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocognit:
      min-complexity: 35
    gocritic:
      disabled-checks:
        - ifElseChain
    gomoddirectives:
      replace-local: true
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
    makezero:
      always: false
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
        - disabled: false
          name: unused-parameter
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      check-receiver: false
      check-return: false
      ignore-names:
        - g
        - id
        - r
        - t
        - w
        - tb
        - tt
        - ip
        - i
        - ok
        - wg
        - err
        - d
        - p
        - m
        - v
        - e
        - s
        - o
        - c
        - k
        - b
        - f
        - "n"
        - ctx
        - tc
        - op
        - md
        - ch
        - l
        - lc
        - h
        - q
        - uc
        - fn
        - tx
        - mw
        - ts
        - mu
        - rs
        - j
        - db
  exclusions:
    generated: lax
    rules:
      # ── Test files ──────────────────────────────────────────────
      # Test code prioritises clarity of intent over strict style
      # enforcement. These linters produce noise in test suites without
      # catching real defects.
      - path: _test\.go$
        linters:
          - err113
          - exhaustruct
          - makezero
          - paralleltest
          - thelper
          - wrapcheck
          - tagalign
          - gosec
          - goconst
          - wsl_v5
          - intrange
          - modernize
          - dupl
          - dupword
          - revive
          - unparam
          - fatcontext
          - errcheck
          - nilnil
          - varnamelen
          - ginkgolinter
          - gocritic
          - errname
          - predeclared
          - noctx
          - forcetypeassert
          - tagliatelle
      # Additional test relaxations: test files may exceed complexity
      # thresholds and use package-level helpers/globals.
      - path: _test\.go
        linters:
          - exhaustruct
          - testpackage
          - gochecknoglobals
          - funlen
          - cyclop
          - goconst
      # 'unused' false-positives in test helpers exercised conditionally
      # (build tags, sub-tests).
      - path: _test\.go
        text: unused
        linters:
          - unused

      # ── ireturn: idiomatic interface returns ─────────────────────
      # This library exports interfaces as its primary API (event.Store,
      # kv.Store, projection.Projection, etc.). Factory functions return
      # these interfaces by design — ireturn's "don't return interfaces"
      # rule conflicts with the library's composition philosophy.
      - path: (kv|otel|stack|decider|schema|snapshot|graph|projectionhost|catalog|middleware|transport)/
        linters:
          - ireturn

      # ── Internal test helpers ────────────────────────────────────
      # Test fixture files and cattest use relaxed style rules.
      - path: internal/cattest/
        linters:
          - thelper
          - exhaustruct
          - gosec
          - err113
          - goconst
      - path: testhelpers/fake.*\.go$
        linters:
          - exhaustruct
      # testhelpers/ — nlreturn is noisy for short test assertions.
      - path: testhelpers/
        linters:
          - nlreturn

      # ── Generated / schema-heavy files ───────────────────────────
      # upcaster.go has a parameter that mirrors the interface signature.
      - path: upcaster\.go$
        linters:
          - unparam
      # Schema definition files use partial struct initialization by design.
      - path: schema.*\.go$
        linters:
          - exhaustruct

      # ── Integration tests ────────────────────────────────────────
      # Cross-module integration tests exceed cognitive complexity
      # thresholds because they exercise full pipelines end-to-end.
      - path: integration/
        linters:
          - staticcheck
          - gocognit

      # ── Examples ─────────────────────────────────────────────────
      # Example code prioritises readability over production strictness.
      - path: example/
        linters:
          - forbidigo
          - exhaustruct
          - wrapcheck

      # ── Tombstone deprecation (ADR-0114) ─────────────────────────
      # Tombstone APIs (event.MarkTombstone, event.TombstoneStatus, etc.)
      # are deprecated in favour of domain events. Migration is in progress
      # across storage/, listing/, watermill/, stack/sqlite/ — suppress
      # SA1019 until the migration completes.
      - path: (storage|listing|watermill|stack/sqlite)/.*\.go$
        linters:
          - staticcheck
        text: "SA1019: (event\\.MarkTombstone|event\\.TombstoneStatus|event\\.TombstoneMark|event\\.DetectTombstone|event\\.MarkRebirth|event\\.MetadataKeyTombstone|event\\.MetadataKeyRebirth) is deprecated"

      # ── EnsureCustom backward-compat tests ──────────────────────
      # EnsureCustom is deprecated (use WithCustom). Dedicated tests in
      # event/ and metadata/ verify the deprecated API still works.
      - path: (event|metadata)/.*_test\.go$
        linters:
          - staticcheck
        text: "SA1019: .*EnsureCustom.*is deprecated"

      # ── Idempotency MemoryStore in tests ─────────────────────────
      # go-idempotency deprecates MemoryStore/NewMemoryStore for production
      # use; the deprecation notice names tests as the sanctioned consumer.
      # Middleware test pipelines and kvstore test matrices intentionally
      # exercise the in-memory store (kvstore compares it against the
      # KV-backed store in the same table).
      - path: (middleware|idempotency)/.*_test\.go$
        linters:
          - staticcheck
        text: "SA1019: .*(NewMemoryStore|MemoryStore) is deprecated"

      # ── id/ branded-ID module ───────────────────────────────────
      # ActorID uses unexported fields with custom Marshaler/Unmarshaler
      # implementations. Mixed receiver pattern is intentional (Marshal
      # = value receiver, Unmarshal = pointer receiver).
      - path: id/
        linters:
          - err113
          - errcheck
          - exhaustive
          - exhaustruct
          - recvcheck
          - wrapcheck
          - nolintlint

      # ── record/ shared Record type ──────────────────────────────
      # time.Time fields use omitempty for backward-compatible JSON
      # (clients that don't set timestamps omit them). modernize
      # suggests omitzero but that changes wire format.
      - path: record/
        linters:
          - modernize

      # ── metaengine engine register.go files ────────────────────
      # Engine modules use init() for driver registration (same pattern
      # as database/sql drivers).
      - path: metaengine/(.*/)?register\.go$
        linters:
          - gochecknoinits

      # ── metaengine/mysqlengine ──────────────────────────────────
      # External MySQL driver; same sqlclosecheck false-positives as
      # pgengine and duckdbengine (CloseRows indirection not visible).
      - path: metaengine/mysqlengine/
        linters:
          - sqlclosecheck
          - wrapcheck
          - varnamelen
      # ── system/ deployer composition root ────────────────────────
      # The system/ module wires infrastructure via reflection and dynamic
      # dispatch (driver registry, auto-wired projections). Many style
      # linters are too strict for this intentional complexity.
      - path: system/
        linters:
          - exhaustruct
          - wrapcheck
          - ireturn
          - gosec
          - gochecknoglobals
          - gochecknoinits
          - gocognit
          - godoclint
          - musttag
          - nestif
          - nlreturn
          - nonamedreturns
          - revive
          - tagliatelle
          - varnamelen
          - forcetypeassert
          - gocyclo
          - cyclop
          - maintidx

      # ── metaengine/ cost-based planner ───────────────────────────
      # The metaengine has inherent complexity (cost models, ADT
      # classification, layout planning). It uses interface returns,
      # type assertions, and numeric constants essential to its design.
      - path: metaengine/
        linters:
          - cyclop
          - gocyclo
          - exhaustruct
          - forcetypeassert
          - gocognit
          - ireturn
          - mnd
          - gosec
          - goconst
          - exhaustive
          - varnamelen
          - wsl_v5
          - nonamedreturns
          - nlreturn
          - tagliatelle
          - funlen
          - nestif
          - err113
          - gochecknoglobals
          - wrapcheck
          - nolintlint
          - containedctx
          - modernize
      # Iroh engine: CGo bridge with external dependency (iroh-go).
      # Relaxed style for FFI boundary code.
      - path: metaengine/irohengine/
        linters:
          - exhaustruct
          - wrapcheck
          - prealloc
          - gochecknoglobals
          - predeclared
          - gocritic
      # Iroh demos: standalone example programs, not production code.
      - path: metaengine/irohengine/(quic/)?demo/
        linters:
          - forbidigo
          - errcheck
          - gocritic
          - revive
          - unused
      - path: metaengine/irohengine/demo/
        linters:
          - forbidigo
          - errcheck
      # DuckDB engine: CGo + external driver, relaxed for FFI code.
      - path: metaengine/duckdbengine/
        linters:
          - wrapcheck
          - varnamelen
          - wsl_v5
          - sqlclosecheck
          - prealloc
      # Postgres engine: external driver (pgx).
      - path: metaengine/pgengine/
        linters:
          - wrapcheck
          - varnamelen
          - sqlclosecheck
          - wsl_v5
      # Pebble engine: external LSM driver, performance-oriented code.
      - path: metaengine/pebbleengine/
        linters:
          - wrapcheck
          - makezero
          - modernize
          - prealloc
          - varnamelen
          - gosec
          - gochecknoglobals

      # ── storage/ SQL store layer ─────────────────────────────────
      # Complex dialect handling and driver interop. sqlpkg.CloseRows is
      # the project-wide rows.Close helper; sqlclosecheck cannot see through
      # the indirection.
      - path: storage/
        linters:
          - dupl
          - exhaustruct
          - gosec
          - mnd
          - nestif
          - nilnil
          - tagliatelle
          - varnamelen
          - wrapcheck
          - nlreturn
          - wsl_v5
          - contextcheck
          - ireturn
          - sqlclosecheck

      # ── Turso external driver ────────────────────────────────────
      # External driver (tursogo), experimental indexing advisor.
      - path: turso/indexing/
        linters:
          - exhaustruct
          - goconst
          - exhaustive
          - errcheck
          - errorlint
          - nlreturn
          - wsl_v5
          - modernize
          - perfsprint
          - predeclared
          - nolintlint
          - wrapcheck
          - varnamelen
      - path: turso/indexing\.go$
        linters:
          - wsl_v5
      - path: turso/.*_test\.go$
        linters:
          - rowserrcheck
          - sqlclosecheck
          - unqueryvet
          - staticcheck
          - varnamelen

      # ── commandtest/querytest shared test suites ───────────────
      # Test assertion counts and ULID-ordering sleeps use magic numbers
      # inherently — these are test fixtures, not production logic.
      - path: command/commandtest/
        linters:
          - mnd
      - path: query/querytest/
        linters:
          - mnd

      # ── catalog/ schema exporters ────────────────────────────────
      # Boilerplate-heavy code with repetitive struct initialization
      # across multiple output formats (AsyncAPI, D2, OpenAPI, etc.).
      - path: catalog/eventcatalog/
        linters:
          - dupl
          - exhaustruct
          - gocognit
          - nonamedreturns
          - varnamelen
          - wsl_v5
      - path: catalog/(d2|asyncapi|openapi|docserver|httptyped|huma|cmd)/
        linters:
          - exhaustruct
          - nlreturn
          - nolintlint
          - wrapcheck
          - staticcheck
      - path: catalog/(message_config|registry_build)\.go$
        linters:
          - exhaustruct
      - path: catalog/registry.go$
        linters:
          - exhaustruct
      - path: catalog/registry_copy.go$
        linters:
          - varnamelen
      - path: catalog/registry_helpers.go$
        linters:
          - varnamelen
      - path: catalog/.*_test.go$
        linters:
          - usestdlibvars
          - nolintlint
          - varnamelen

      # ── projection/ ──────────────────────────────────────────────
      # Interface-heavy projection API; runner has error wrapping patterns.
      - path: projection/
        linters:
          - exhaustruct
          - tagliatelle
          - nlreturn
          - ireturn
      - path: projection/runner\.go$
        linters:
          - wrapcheck
          - err113

      # ── encryption/ ──────────────────────────────────────────────
      # Cryptographic primitives use low-level operations and interface
      # returns that trigger style linters.
      - path: encryption/
        linters:
          - ireturn
          - wrapcheck
          - nolintlint
      - path: encryption/.*_test.go$
        linters:
          - contextcheck
          - varnamelen
      - path: encryption/store.go$
        linters:
          - wrapcheck
      - path: encryption/(aesgcm|xchacha20|envelope)\.go$
        linters:
          - nlreturn
          - dupword
          - forcetypeassert
          - wsl_v5

      # ── signing/ ─────────────────────────────────────────────────
      # Signing uses interface returns and low-level crypto operations.
      - path: signing/
        linters:
          - ireturn
          - wrapcheck
          - nolintlint

      # ── watermill/ external broker adapter ───────────────────────
      # ThreeDotsLabs/watermill adapter: serialization/deserialization
      # with complex error paths and interface returns.
      - path: watermill/
        linters:
          - wsl_v5
          - wrapcheck
          - err113
          - nestif
          - mnd
          - exhaustruct
          - dupl
          - errcheck
          - perfsprint
          - nolintlint
          - ireturn
          - varnamelen

      # ── transport/ ───────────────────────────────────────────────
      # SSE broker uses interface returns; event delivery has error paths.
      - path: transport/http/sse
        linters:
          - exhaustruct
          - wrapcheck
      - path: transport/http/sse_event\.go$
        linters:
          - err113

      # ── stack/ bundle presets ────────────────────────────────────
      # Bundle presets wire infrastructure; accessors and materialize use
      # interface returns and nested error handling.
      - path: stack/materialize\.go$
        linters:
          - wrapcheck
          - nestif
      - path: stack/contracttest/
        linters:
          - errcheck
          - goconst
          - varnamelen
      - path: stack/accessors\.go$
        linters:
          - err113
          - exhaustruct
          - wrapcheck
      - path: stack/(turso|pebble)/preset\.go$
        linters:
          - exhaustruct
          - err113
          - contextcheck
          - wrapcheck
      # Benchmark suite: performance measurement code.
      - path: stack/bench/
        linters:
          - containedctx
          - gocognit
          - nilerr
          - unconvert

      # ── benchkit/ benchmark factory suite ────────────────────────
      # Measurement code with globals and interface returns.
      - path: benchkit/
        linters:
          - errcheck
          - exhaustruct
          - gochecknoglobals
          - goconst
          - gosec
          - ireturn
          - mnd
          - nonamedreturns
          - tagliatelle
          - wrapcheck

      # ── cmd/ CLI tools ───────────────────────────────────────────
      # Code generation, linting, benchmarking CLIs. These use globals
      # (registration), complex dispatch, and cobra CLI patterns.
      - path: cmd/cqrs-gen/
        linters:
          - dupl
          - exhaustruct
          - err113
          - funlen
          - gocognit
          - mnd
          - nlreturn
          - varnamelen
          - wrapcheck
          - wsl_v5
          - dupword
          - forbidigo
          - gosec
      - path: cmd/cqrs-lint/
        linters:
          - exhaustruct
          - funlen
          - gocognit
          - goconst
          - godoclint
          - gosec
          - mnd
          - nestif
          - nonamedreturns
          - varnamelen
          - wrapcheck
          - forbidigo
          - wsl_v5
          - nlreturn
          - gocyclo
          - cyclop
          - maintidx
      - path: cmd/cqrs-bench/
        linters:
          - errcheck
          - exhaustruct
          - forbidigo
          - goconst
          - gosec
          - ireturn
          - mnd
          - noctx
          - wrapcheck
          - varnamelen
          - err113
          - nolintlint
          - contextcheck
      - path: cmd/doc-check/
        linters:
          - gosec
          - err113
      - path: cmd/api-stability/
        linters:
          - gocognit

      # ── system/ operator topology ───────────────────────────────
      # Deployer-picks-infrastructure model with driver registry,
      # serialization, scream store, and health checks.
      - path: system/
        linters:
          - err113
          - goconst
          - prealloc
          - perfsprint
          - funlen
          - golines
          - wsl_v5
      # ── saga/ (experimental) ─────────────────────────────────────
      # Saga orchestration is experimental; relaxed until stabilized.
      - path: saga/
        linters:
          - nlreturn
          - exhaustruct
          - err113
          - mnd
          - dupl
          - wrapcheck
          - wsl_v5
          - embeddedstructfieldcheck

      # ── Module-specific small exclusions ─────────────────────────
      # kv/viewstoretest/ — shared contract test suite; complex setup.
      - path: kv/viewstoretest/
        linters:
          - gocognit
          - errcheck
      # command/ — functional options trigger exhaustruct/nolintlint noise.
      - path: command/
        linters:
          - wrapcheck
          - exhaustruct
          - nolintlint
      # query/ — functional options trigger exhaustruct/wrapcheck noise
      # (same shape as command/; AsRecord leaves store-side fields zero).
      - path: query/
        linters:
          - wrapcheck
          - exhaustruct
          - nolintlint
      # sync/ — experimental sync primitives.
      - path: sync/
        linters:
          - modernize
      # catalog/docserver/ — templ-generated files confuse two linters:
      # contextcheck cannot see ctx flow through generated closures, and
      # godoclint counts each *_templ.go file header as an extra package
      # godoc (reported at the hand-written docserver.go).
      - path: catalog/docserver/
        linters:
          - contextcheck
          - godoclint
    # ── Globally excluded paths ────────────────────────────────────
    # event/ and event/v4/eventtest/ have their own lint config (per-module
    # GOWORK=off builds). storage/view/ is generated from the view template.
    # Generated and protobuf files are excluded by convention.
    paths:
      - \.gen\.go$
      - \.pb\.go$
      - _templ\.go$
      - event/
      - event/eventtest/
      - event/v4/eventtest/
      - storage/view/
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(github.com/larsartmann/go-cqrs-lite)
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - \.pb\.go$
      - _templ\.go$
      - event/
      - event/eventtest/
      - event/v4/eventtest/
      - storage/view/
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
