<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Architecture proposal: the Stack layer — decoupling application code from infrastructure decisions in go-cqrs-lite."
    />
    <title>The Stack Layer — go-cqrs-lite Deployment-First Proposal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;0,6..72,800;1,6..72,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
        --font-sans: "Inter", system-ui, -apple-system, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;

        --bg: #fdfcfa;
        --bg-elevated: #ffffff;
        --surface: #f5f4f0;
        --border: #d4d2cc;
        --border-strong: #a8a59c;
        --text: #1a1917;
        --text-secondary: #4a4946;
        --text-tertiary: #787671;
        --accent: #c41e3a;
        --accent-muted: #e8c4ca;
        --success: #1a5c3a;
        --warn: #8c6b1f;
        --danger: #8c1a1a;
        --info: #1a3a5c;

        --max-width: 820px;
        --sidebar-width: 220px;
        --gutter: 2.5rem;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d0d0c;
          --bg-elevated: #161614;
          --surface: #1e1e1b;
          --border: #2e2e2a;
          --border-strong: #4a4a44;
          --text: #e8e6e1;
          --text-secondary: #a8a59c;
          --text-tertiary: #6a6862;
          --accent: #e85d75;
          --accent-muted: #5c2a32;
          --success: #4ade80;
          --warn: #fbbf24;
          --danger: #f87171;
          --info: #60a5fa;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
        scroll-padding-top: 1rem;
        font-size: 16px;
      }

      body {
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--text);
        line-height: 1.7;
        font-size: 0.95rem;
        -webkit-font-smoothing: antialiased;
      }

      ::selection {
        background: var(--accent-muted);
        color: var(--text);
      }

      /* LAYOUT */
      .page {
        display: grid;
        grid-template-columns: var(--sidebar-width) 1fr;
        max-width: calc(var(--sidebar-width) + var(--max-width) + var(--gutter) * 2);
        margin: 0 auto;
        min-height: 100vh;
      }

      @media (max-width: 900px) {
        .page {
          grid-template-columns: 1fr;
        }
      }

      /* SIDEBAR */
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 2.5rem 1.5rem;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 2.5rem;
        overflow-y: auto;
      }

      @media (max-width: 900px) {
        .sidebar {
          position: static;
          height: auto;
          border-right: none;
          border-bottom: 1px solid var(--border);
          padding: 1.5rem;
          flex-direction: row;
          flex-wrap: wrap;
          align-items: center;
          gap: 1rem;
        }
      }

      .sidebar-brand {
        font-family: var(--font-serif);
        font-weight: 800;
        font-size: 1.3rem;
        line-height: 1.1;
        color: var(--text);
        text-decoration: none;
        letter-spacing: -0.02em;
      }

      .sidebar-brand span {
        display: block;
        font-family: var(--font-sans);
        font-size: 0.65rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-tertiary);
        margin-top: 0.3rem;
      }

      .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        list-style: none;
      }

      @media (max-width: 900px) {
        .sidebar-nav {
          flex-direction: row;
          flex-wrap: wrap;
        }
      }

      .sidebar-nav a {
        display: block;
        padding: 0.35rem 0.6rem;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 0.82rem;
        font-weight: 500;
        border-radius: 0;
        border-left: 2px solid transparent;
        transition:
          color 0.15s,
          border-color 0.15s;
      }

      .sidebar-nav a:hover {
        color: var(--text);
        border-left-color: var(--border);
      }

      .sidebar-nav a.active {
        color: var(--accent);
        border-left-color: var(--accent);
        font-weight: 600;
      }

      @media (max-width: 900px) {
        .sidebar-nav a {
          border-left: none;
          border-bottom: 2px solid transparent;
          padding: 0.3rem 0.5rem;
        }
        .sidebar-nav a:hover {
          border-bottom-color: var(--border);
          border-left-color: transparent;
        }
        .sidebar-nav a.active {
          border-bottom-color: var(--accent);
          border-left-color: transparent;
        }
      }

      .sidebar-meta {
        margin-top: auto;
        font-size: 0.72rem;
        color: var(--text-tertiary);
        line-height: 1.6;
      }

      @media (max-width: 900px) {
        .sidebar-meta {
          display: none;
        }
      }

      /* MAIN */
      .main {
        padding: 3rem var(--gutter) 5rem;
        max-width: var(--max-width);
      }

      @media (max-width: 900px) {
        .main {
          padding: 2rem 1.5rem;
        }
      }

      /* TYPOGRAPHY */
      h1 {
        font-family: var(--font-serif);
        font-size: clamp(2.8rem, 6vw, 4rem);
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.03em;
        color: var(--text);
        margin-bottom: 1.5rem;
      }

      h2 {
        font-family: var(--font-serif);
        font-size: clamp(1.6rem, 3.5vw, 2.2rem);
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.02em;
        margin-top: 4rem;
        margin-bottom: 1.25rem;
        padding-bottom: 0.75rem;
        border-bottom: 2px solid var(--text);
        color: var(--text);
      }

      h3 {
        font-family: var(--font-serif);
        font-size: 1.3rem;
        font-weight: 700;
        margin-top: 2.5rem;
        margin-bottom: 0.75rem;
        color: var(--text);
        letter-spacing: -0.01em;
      }

      h4 {
        font-family: var(--font-sans);
        font-size: 0.95rem;
        font-weight: 700;
        margin-bottom: 0.4rem;
        color: var(--text);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      p {
        color: var(--text-secondary);
        margin: 0.9em 0;
        max-width: 65ch;
      }

      p.lead {
        font-family: var(--font-serif);
        font-size: 1.25rem;
        line-height: 1.55;
        color: var(--text-secondary);
        font-style: italic;
        margin-bottom: 2rem;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      strong {
        color: var(--text);
        font-weight: 600;
      }
      em {
        font-family: var(--font-serif);
        font-style: italic;
      }

      /* RULE */
      hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 3rem 0;
      }

      /* SECTION NUMBERS */
      .section-num {
        font-family: var(--font-serif);
        font-size: 0.7em;
        font-weight: 400;
        color: var(--text-tertiary);
        margin-right: 0.5rem;
        vertical-align: super;
      }

      /* SUMMARY GRID */
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1px;
        background: var(--border);
        border: 1px solid var(--border);
        margin: 2.5rem 0 1.5rem;
      }

      @media (max-width: 700px) {
        .summary-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .stat-cell {
        background: var(--bg);
        padding: 1.25rem 1.5rem;
        text-align: center;
      }

      .stat-value {
        font-family: var(--font-serif);
        font-size: 2.2rem;
        font-weight: 800;
        line-height: 1.1;
        color: var(--text);
        margin-bottom: 0.3rem;
      }

      .stat-label {
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-tertiary);
        margin-bottom: 0.3rem;
      }

      .stat-desc {
        font-size: 0.8rem;
        color: var(--text-tertiary);
        line-height: 1.4;
      }

      /* TABLES */
      .table-wrap {
        overflow-x: auto;
        margin: 1.5rem 0 2rem;
        border: 1px solid var(--border);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
        min-width: 600px;
      }

      th {
        text-align: left;
        padding: 0.8rem 1rem;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-tertiary);
        background: var(--surface);
        border-bottom: 1px solid var(--border-strong);
        white-space: nowrap;
      }

      td {
        padding: 0.85rem 1rem;
        border-bottom: 1px solid var(--border);
        color: var(--text-secondary);
        vertical-align: top;
      }

      tr:last-child td {
        border-bottom: none;
      }
      tbody tr {
        transition: background 0.12s;
      }
      tbody tr:hover {
        background: var(--surface);
      }

      /* TAGS */
      .tag {
        display: inline-block;
        font-family: var(--font-mono);
        font-size: 0.68rem;
        font-weight: 500;
        padding: 0.2rem 0.5rem;
        border: 1px solid;
        white-space: nowrap;
        letter-spacing: 0.02em;
      }

      .tag-done {
        color: var(--success);
        border-color: var(--success);
        background: transparent;
      }
      .tag-partial {
        color: var(--warn);
        border-color: var(--warn);
        background: transparent;
      }
      .tag-missing {
        color: var(--danger);
        border-color: var(--danger);
        background: transparent;
      }
      .tag-idea {
        color: var(--info);
        border-color: var(--info);
        background: transparent;
      }

      /* CODE */
      code,
      pre {
        font-family: var(--font-mono);
        font-size: 0.85em;
      }

      code {
        padding: 0.1em 0.35em;
        background: var(--surface);
        color: var(--text);
        font-weight: 500;
      }

      pre {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        padding: 1.25rem;
        overflow-x: auto;
        margin: 1rem 0 1.5rem;
        line-height: 1.65;
      }

      pre code {
        background: transparent;
        padding: 0;
        font-weight: 400;
        font-size: 0.88em;
      }

      /* SYNTAX HIGHLIGHTING — restrained */
      .hl-kw {
        color: var(--accent);
        font-weight: 600;
      }
      .hl-type {
        color: var(--text);
        font-weight: 600;
      }
      .hl-func {
        color: var(--text);
        font-weight: 600;
      }
      .hl-str {
        color: var(--success);
      }
      .hl-comment {
        color: var(--text-tertiary);
        font-style: italic;
      }
      .hl-field {
        color: var(--text-secondary);
      }

      /* PHASES */
      .phase {
        display: grid;
        grid-template-columns: 2.5rem 1fr;
        gap: 1rem;
        margin: 1rem 0;
        padding: 1.25rem 0;
        border-bottom: 1px solid var(--border);
      }

      .phase:first-of-type {
        padding-top: 0;
      }
      .phase:last-of-type {
        border-bottom: none;
      }

      .phase-num {
        font-family: var(--font-serif);
        font-size: 1.6rem;
        font-weight: 800;
        line-height: 1;
        color: var(--text-tertiary);
        text-align: right;
        padding-top: 0.1rem;
      }

      .phase-body h4 {
        font-family: var(--font-serif);
        font-size: 1.1rem;
        font-weight: 700;
        margin: 0 0 0.3rem;
        text-transform: none;
        letter-spacing: 0;
      }

      .phase-body p {
        margin: 0;
        font-size: 0.92rem;
      }

      .phase-progress {
        width: 100%;
        height: 2px;
        background: var(--border);
        margin-top: 0.75rem;
      }

      .phase-progress > span {
        display: block;
        height: 100%;
        background: var(--accent);
        transition: width 1s ease-out;
        width: 0;
      }

      /* GRIDS */
      .two-col {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1px;
        background: var(--border);
        border: 1px solid var(--border);
        margin: 1.5rem 0;
      }

      @media (max-width: 640px) {
        .two-col {
          grid-template-columns: 1fr;
        }
      }

      .feature-card {
        padding: 1.5rem;
        background: var(--bg);
      }

      .feature-card h4 {
        font-family: var(--font-serif);
        font-size: 1.05rem;
        font-weight: 700;
        text-transform: none;
        letter-spacing: 0;
        margin-bottom: 0.4rem;
      }

      .feature-card p {
        margin: 0;
        font-size: 0.9rem;
      }

      /* CALLOUTS */
      .callout {
        padding: 1.25rem 1.5rem;
        background: var(--surface);
        border-left: 3px solid var(--accent);
        margin: 1.5rem 0;
      }

      .callout p {
        margin: 0;
      }
      .callout strong {
        color: var(--text);
      }

      .callout-warn {
        border-left-color: var(--warn);
      }
      .callout-info {
        border-left-color: var(--info);
      }

      /* ACTOR GRID */
      .actor-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        background: var(--border);
        border: 1px solid var(--border);
        margin: 1.5rem 0 2rem;
      }

      @media (max-width: 640px) {
        .actor-grid {
          grid-template-columns: 1fr;
        }
      }

      .actor {
        padding: 1.5rem;
        background: var(--bg);
      }

      .actor h4 {
        font-family: var(--font-serif);
        font-size: 1.1rem;
        font-weight: 700;
        text-transform: none;
        letter-spacing: 0;
        margin-bottom: 0.5rem;
        color: var(--accent);
      }

      .actor p {
        margin: 0;
        font-size: 0.88rem;
      }

      .actor .role {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-tertiary);
        margin-bottom: 0.6rem;
      }

      /* LAYER DIAGRAM */
      .layer-diagram {
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 1.5rem;
        margin: 1.5rem 0;
        font-family: var(--font-mono);
        font-size: 0.78rem;
        line-height: 1.85;
        color: var(--text-secondary);
        overflow-x: auto;
      }

      .layer-diagram .lyr {
        display: block;
        padding: 0.4rem 0.7rem;
        margin: 0.3rem 0;
        border: 1px solid var(--border);
        background: var(--bg-elevated);
      }
      .layer-diagram .lyr-3 {
        border-left: 4px solid var(--accent);
      }
      .layer-diagram .lyr-2 {
        border-left: 4px solid var(--info);
      }
      .layer-diagram .lyr-1 {
        border-left: 4px solid var(--success);
      }
      .layer-diagram .lbl {
        color: var(--text-tertiary);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-top: 0.6rem;
        margin-bottom: 0.1rem;
      }
      .layer-diagram .arrow {
        color: var(--text-tertiary);
        text-align: center;
        font-size: 0.7rem;
        margin: 0.1rem 0;
      }

      /* LISTS */
      ul.plain,
      ol {
        padding-left: 1.3rem;
        margin: 0.9rem 0;
      }
      li {
        margin: 0.5rem 0;
        color: var(--text-secondary);
      }
      li::marker {
        color: var(--text-tertiary);
      }

      /* FOOTER */
      .footer {
        margin-top: 4rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
        color: var(--text-tertiary);
        font-size: 0.82rem;
      }

      /* PRINT */
      @media print {
        .sidebar {
          display: none;
        }
        .page {
          grid-template-columns: 1fr;
        }
        .main {
          padding: 1rem;
        }
        body {
          background: white;
          color: black;
        }
      }
    </style>
  </head>
  <body></body>
</html>
