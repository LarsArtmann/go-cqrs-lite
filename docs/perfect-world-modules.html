      >
        <tspan x="3826.500000" dy="0.000000">What Changed vs Previous Perfect World</tspan>
        <tspan x="3826.500000" dy="11.120000"></tspan>
        <tspan x="3826.500000" dy="11.120000">
          1. command/ and query/ NO LONGER depend on event/
        </tspan>
        <tspan x="3826.500000" dy="11.120000">
          The old coupling was 5+3 lines of error constructors. Now they use errs/.
        </tspan>
        <tspan x="3826.500000" dy="11.120000"></tspan>
        <tspan x="3826.500000" dy="11.120000">
          2. Error taxonomy extracted to errs/ leaf module
        </tspan>
        <tspan x="3826.500000" dy="11.120000">
          NewRejection has nothing to do with events — it is go-error-family re-exported.
        </tspan>
        <tspan x="3826.500000" dy="11.120000"></tspan>
        <tspan x="3826.500000" dy="11.120000">
          3. InMemoryRunner moved from event/ to projection/
        </tspan>
        <tspan x="3826.500000" dy="11.120000">A runner is runtime behavior, not a contract.</tspan>
        <tspan x="3826.500000" dy="11.120000"></tspan>
        <tspan x="3826.500000" dy="11.120000">
          4. OutboxPublisher moved from event/ to memory/
        </tspan>
        <tspan x="3826.500000" dy="11.120000">
          Background goroutine is not an interface definition.
        </tspan>
        <tspan x="3826.500000" dy="11.120000"></tspan>
        <tspan x="3826.500000" dy="11.120000">
          5. core/ split from 1 go.mod into 6 independent modules
        </tspan>
        <tspan x="3826.500000" dy="11.120000">
          event/, id/, errs/, dispatcher/, command/, query/
        </tspan>
        <tspan x="3826.500000" dy="11.120000"></tspan>
        <tspan x="3826.500000" dy="11.120000">6. storage/ split by backend</tspan>
        <tspan x="3826.500000" dy="11.120000">
          storage/sql/ and storage/pebble/ — do not pay for Pebble when you want SQLite.
        </tspan>
        <tspan x="3826.500000" dy="11.120000"></tspan>
        <tspan x="3826.500000" dy="11.120000">7. testhelpers/ junk drawer deleted</tspan>
        <tspan x="3826.500000" dy="11.120000">
          Fakes moved to memory/. Handler stubs deleted. Assertions use stdlib.
        </tspan>
        <tspan x="3826.500000" dy="11.120000"></tspan>
        <tspan x="3826.500000" dy="11.120000">8. aggregate/ deleted</tspan>
        <tspan x="3826.500000" dy="11.120000">
          Dead code is a lie about the system. decider/ replaces it.
        </tspan>
      </text>
    </g>
