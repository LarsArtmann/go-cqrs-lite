<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>go-cqrs-lite — Web Client Communication</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1rem;
      }
      h1 {
        font-size: 1.5rem;
        color: #1a1a2e;
        margin-bottom: 0.5rem;
      }
      .subtitle {
        font-size: 0.9rem;
        color: #555;
        font-style: italic;
        margin-bottom: 1rem;
      }
      .diagram-container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 1rem;
        max-width: 100%;
        overflow: auto;
      }
      .diagram-container svg {
        max-width: 100%;
        height: auto;
      }
      .controls {
        margin-top: 1rem;
        display: flex;
        gap: 0.5rem;
      }
      .controls button {
        padding: 0.4rem 1rem;
        border: 1px solid #bdbdbd;
        border-radius: 6px;
        background: white;
        cursor: pointer;
        font-size: 0.85rem;
      }
      .controls button:hover {
        background: #e3f2fd;
      }
      .source {
        margin-top: 1rem;
        font-size: 0.75rem;
        color: #999;
      }
      .source a {
        color: #1565c0;
        text-decoration: none;
      }
      .source a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>go-cqrs-lite — Web Client Communication</h1>
    <p class="subtitle">
      How Commands, Queries, Events &amp; Projections flow from browser to read model and back
    </p>
    <div class="diagram-container" id="diagram">
      <object data="web-client-communication.svg" type="image/svg+xml" width="100%">
        <p>SVG not supported. <a href="web-client-communication.svg">View SVG directly</a></p>
      </object>
    </div>
    <div class="controls">
      <button onclick="zoom(0.9)">Zoom Out</button>
      <button onclick="zoom(1.0)">Reset</button>
      <button onclick="zoom(1.1)">Zoom In</button>
    </div>
    <p class="source">
      Source: <a href="web-client-communication.d2">web-client-communication.d2</a> |
      <a href="https://d2lang.com">D2 Language</a> |
      <a href="https://github.com/larsartmann/go-cqrs-lite">GitHub</a>
    </p>
    <script>
      let scale = 1;
      function zoom(factor) {
        scale = factor === 1.0 ? 1 : scale * factor;
        const obj = document.querySelector("object");
        if (obj && obj.contentDocument) {
          const svg = obj.contentDocument.querySelector("svg");
          if (svg) {
            svg.style.transformOrigin = "top left";
            svg.style.transform = "scale(" + scale + ")";
          }
        }
      }
    </script>
  </body>
</html>
