# BuildFlow Configuration
# See: https://github.com/larsartmann/buildflow

# FIXME/XXX/BUG-class markers fail; TODO/NOTE/OPTIMIZE do not block commits.
todo_min_severity: warning

# go-version-auto-configure UNSKIPPED 2026-10-07: every directive is
# minor-form (go 1.27) since the supply-side re-tags, and gvac v0.2.5 adds
# respect_patch_floor — a deliberate patch pin at or below the installed
# toolchain (the W3 Q4 contract, docs/agents/gowork-modes.md) is now
# policy, not drift. The directive-downgrade waves it once caused are
# structurally over (the tidy gate + the option both guard them).
tool_options:
  go-version-auto-configure:
    respect_patch_floor: true

# GOTOOLCHAIN removed 2026-10-07: BuildFlow auto-derives GOTOOLCHAIN=auto
# when the workspace contract (go 1.27.1) exceeds the host go (1.26.7); in
# the nix sandbox the pinned go_1_27 already satisfies the directive, so no
# download is attempted.
env:
  # /mnt/buildcache (host go's default cache mount) hit 100% on 2026-09-22 —
  # every tool write failed with ENOSPC. Use the same disk-backed chain as the
  # repo's verify apps (docs/agents/gowork-modes.md), all on / which has room.
  GOCACHE: /home/lars/projects/.gocache-disk
  GOMODCACHE: /tmp/gomod-verify
  GOPATH: /tmp/gopath-verify
  GOLANGCI_LINT_CACHE: /home/lars/projects/.golangci-disk
  GOTMPDIR: /home/lars/projects/.gotmp

exclude:
  - "**/docserver/static/**"
  - "**/eventcatalog-output/**"
  # transport/grpc is isolated from go.work (genproto conflict via cockroachdb/errors).
  # BuildFlow's golangci-lint can't typecheck it in-workspace. Tracked in TODO_LIST.md.
  - "transport/grpc"

# Render-level per-tool warning ceilings (summary collapse; never gates).
# Set 2026-09-22 from 14d telemetry: max findings/run + ~20% headroom.
# The [OVER budget] marker doubles as a noise-drift tripwire.
warnings_budget:
  markdown-lint: 179000
  go-auto-upgrade: 1000
  lychee: 700
  cqrs-lint: 700
