# go-arch-lint configuration for the event module (intra-module rules)
#
# Run via: scripts/check-arch.sh (from the event/ directory)
# Enforces package-level dependency rules WITHIN the event module.
# Cross-module rules are enforced by scripts/check-module-layers.sh.

version: 3

allow:
  depOnAnyVendor: true

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*testdata/.*$"
  - "^eventtest/.*$" # separate module (event/eventtest)

components:
  core: { in: . }

deps:
  core:
    anyProjectDeps: false
    anyVendorDeps: true
