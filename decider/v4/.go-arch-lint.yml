# go-arch-lint configuration for the decider module (intra-module rules)
#
# Run via: scripts/check-arch.sh (from the decider/ directory)
# Enforces package-level dependency rules WITHIN the decider module.
# Cross-module rules are enforced by scripts/check-module-layers.sh.

version: 3

allow:
  depOnAnyVendor: true

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*testdata/.*$"

components:
  core: { in: . }

deps:
  core:
    anyProjectDeps: false
    anyVendorDeps: true
