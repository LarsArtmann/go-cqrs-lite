# go-arch-lint configuration for the stack module (intra-module rules)
#
# Run via: scripts/check-arch.sh (from the stack/ directory)
# Enforces package-level dependency rules WITHIN the stack module.
# Cross-module rules are enforced by scripts/check-module-layers.sh.

version: 3

allow:
  depOnAnyVendor: true

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*testdata/.*$"
  - "^bbolt/.*$" # separate module
  - "^bench/.*$" # separate module
  - "^duckdb/.*$" # separate module
  - "^memory/.*$" # separate module
  - "^mysql/.*$" # separate module
  - "^pebble/.*$" # separate module
  - "^postgres/.*$" # separate module
  - "^sqlite/.*$" # separate module
  - "^turso/.*$" # separate module

components:
  core: { in: . }
  contracttest: { in: contracttest }
  sqlopt: { in: sqlopt }

deps:
  core:
    anyProjectDeps: false
    anyVendorDeps: true
  contracttest:
    mayDependOn:
      - core
  sqlopt:
    anyProjectDeps: false
    anyVendorDeps: true
