# go-arch-lint configuration for the stack module (intra-module rules)
#
# Run via: scripts/check-arch.sh (from the stack/ directory)
# Enforces package-level dependency rules WITHIN the stack module.
# Cross-module rules are enforced by scripts/check-module-layers.sh.

version: 3

allow:
  depOnAnyVendor: true

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*testdata/.*$"

components:
  core: { in: . }

deps:
  core:
    anyProjectDeps: false
    anyVendorDeps: true
