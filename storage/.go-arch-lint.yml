# go-arch-lint configuration for the storage module (intra-module rules)
#
# Run via: scripts/check-arch.sh (from the storage/ directory)
# Enforces package-level dependency rules WITHIN the storage module.
# Cross-module rules are enforced by scripts/check-module-layers.sh.

version: 3

allow:
  depOnAnyVendor: true

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*testdata/.*$"
  - "^memory/.*$"    # separate module (storage/memory)
  - "^pebble/.*$"    # separate module (storage/pebble)
  - "^turso/.*$"     # separate module (storage/turso)

components:
  core: { in: . }
  sql:  { in: sql }

deps:
  core:
    mayDependOn:
      - sql
  sql:
    anyProjectDeps: false
    anyVendorDeps: true
